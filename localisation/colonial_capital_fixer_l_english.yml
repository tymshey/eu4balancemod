 change_capital_alaska_desc: "Recognizing the historical and symbolic significance of certain colonial capitals, it is deemed paramount to reinstate a connection with our colonial subject's roots. We shall relocate the capital of our colonial subject in Colonial Cascadia to its historic center, reinforcing a sense of cultural and historical coherence."
    
