 #basic idee
 d_quality_prof:0 "Professional Force"
 d_quality_prof_desc:0 "By replacing temporary levies with a fully standing military, our soldiers undergo constant drill and tactical instruction, ensuring superior performance on the battlefield."
 d_spy_artillery:0 "Foundry Standards"
 d_spy_artillery_desc:0 "Standardized casting and improved powder ratios maximize the destructive potential of our heavy guns."
 d_spy_guards:0 "Elite Guards"
 d_spy_guards_desc:0 "Stationing hand-picked, veteran guard detachments at vital fortresses and royal courts maintains iron discipline and protects strategic holds against sudden assaults."
 
 #austria
 AUE:0 "Austrian Empire"
 AUE_ADJ:0 "Austrian"
 form_austrian_empire_title:0 "Form the Austrian Empire"
 form_austrian_empire_desc:0 "Our family has guided Europe for generations, yet the title of Emperor cannot rely solely on the votes of German electors. By elevating our ancestral crown to imperial status, we forge a centralized Empire capable of standing strong against rival powers in both the East and the West."
 aue_received:0 "Bulwark of the Realm"
 aue_received_desc:0 "Centuries of defensive warfare against foreign powers have hardened our forces to resist the standard shock of battle and enemy fire. Our regiments stand resilient in the face of devastating onslaughts."
 aue_absolutism:0 "Austrian Absolutism"
 aue_absolutism_desc:0 "A fractured realm cannot endure the trials of modern warfare. By streamlining imperial administration, enforcing direct Crown appointments, and subordinating local nobility to central decrees, Austria secures absolute control over its resources and armies."
 aue_infantry:0 "Grenzer Discipline"
 aue_infantry_desc:0 "Settled along the Military Frontier, our light infantry and line regiments are bred for border skirmishing and tough combat. Their marksmanship and battle discipline give our infantry a fierce reputation."
 aue_development:0 "Core Crownland Infrastructure"
 aue_development_desc:0 "Centralizing investment and internal improvements within our primary Austrian heartlands ensures that regional governance, agriculture, and urban centers thrive with peak economic efficiency."
 AUE_ideas:0 "Austrian Imperial Ideas"
 AUE_ideas_start:0 "Austrian Imperial Traditions"
 AUE_ideas_bonus:0 "Austrian Imperial Ambition"
 d_is_aue:0 "If we form the §OAustrian Empire§! we will gain the following:"
 d_is_auh:0 "However, by forming §OAustria-Hungary§! we will gain the following instead:"
 austrian_dual_monarchy:0 "Austrian Dual Monarchy"
 d_austrian_ability_1:0 "Rapid Imperial Deployments"
 d_austrian_ability_1_desc:0 "The vast and varied geography of the Empire demands that our legions march with utmost haste. By streamlining our supply routes along the Danube and enforcing rigorous marching drills, our armies can cross crown lands swiftly to neutralize threats before they can consolidate."
 d_austrian_ability_2:0 "Indomitable Spirit of the Empire"
 d_austrian_ability_2_desc:0 "A defeat is merely a temporary setback for the House of Habsburg. Supported by deep regional manpower pools and streamlined mobilization centers, our regiments rapidly replace losses and regain fighting spirit, ready to plunge back into the fray before the enemy can exploit their success."
 d_austrian_ability_3:0 "Boost Militarization"
 d_austrian_ability_3_desc:0 "By expanding the purview of the Hofkriegsrat across every province of the realm, state military planning is fully integrated into peacetime governance. Centralized officer training and systematic conscription ensure the Austrian state remains on a permanent, highly disciplined war footing."
 d_austrian_militarized_society:0 "Austrian Militarization"
 ability_d_austrian_militarization_mechanic:0 "Austrian Militarization"
 monthly_d_austrian_militarized_society:0 "Monthly Austrian Militarized Society"
 hab_multicultural_empire_title:0 "Founding a New Empire"
 czech_ger:0 "Bohemian"
 schlesian_ger:0 "Schlesian"
 d_aue_bohemia_modifier:0 "Habsburg lands of Bohemia"
 d_hab_bohemia_modifier:0 "Czech Industry"
 d_hab_silesia_modifier:0 "Silesian Industralization"
 d_hab_bohemia_title:0 "Royal Bohemia"
 d_hab_bohemia_desc:0 "Bohemia's fertile valleys and rich mines have long been an economic engine of Central Europe. Whether we embrace the Czech people as equal citizens of the realm or gradually incorporate them into the imperial cultural sphere, directing their industrial labor toward the crown will ensure unprecedented prosperity."
 d_bohemia_aue_tooltip:0 "By completing this mission as the §OAustrian Empire§!, the following will happen:\n"
 d_assimilate_czech_tooltip:0 "We will assimilate the §YCzechs§! into the §YGerman§! culture group."
 d_assimilate_silesia_tooltip:0 "We will assimilate the §YSilesians§! into the §YGerman§! culture group."
 d_bohemia_auh_tooltip:0 "However, by completing this mission as §OAustria-Hungary§!, the following will happen instead:\n"
 d_control_silesia_tooltip:0 "If we are in control of §YSilesia§!, an additional bonus will be granted:"
 d_aue_bohemia_tooltip:0 "Bohemia gets §Y'Habsburg lands of Bohemia'§! until the end of the game, giving the following effects:\nLocal Development Cost: §G-10.0%§!\nLocal Production Efficiency: §G+10.0%§!\n"
 d_hab_bohemia_tooltip:0 "Bohemia gets §Y'Czech Industry'§! until the end of the game, giving the following effects:\nLocal Production Efficiency: §G+20.0%§!\n"
 d_hab_lwow_modifier:0 "Polish Cochineal"
 d_aue_manpower_rec_modifier:0 "Accelerated Recruitment"
 
 #francja
 d_fra_algiers_title:0 "Subjugate Algiers"
 d_fra_algiers_desc:0 "The Barbary pirates operating out of Algiers have terrorized Mediterranean shipping for far too long. By establishing a permanent foothold on the Algerian coast, France can safeguard her trade routes and secure the gateway to North Africa."
 d_fra_morocco_title:0 "The Moroccan Protectorate"
 d_fra_morocco_desc:0 "Morocco occupies a vital strategic position overlooking the Strait of Gibraltar and the Atlantic trade lanes. Bringing the Sultanate under French influence will secure our western Mediterranean flank and open new avenues for commerce."
 d_fra_westafrica_title:0 "Treasures of West Africa"
 d_fra_westafrica_desc:0 "The rich goldfields of West Africa present an unprecedented financial windfall for the Crown. By establishing strong trade networks along the coast, we can channel vast wealth directly across the sea, filling the royal mints in Toulon and Aix with African bullion."
 d_fra_tunis_title:0 "Custodian of Kairouan"
 d_fra_tunis_desc:0 "Tunisia is home to Kairouan, one of the most revered holy cities in North Africa. By securing Tunis and asserting our control over the great architectural and spiritual marvels of Kairouan, we can project unmatched authority and prestige across the region."
 d_fra_discover_india_title:0 "Passage to the East"
 d_fra_discover_india_desc:0 "The vast wealth of the Indian subcontinent has long enriched foreign empires. By chartering daring expeditions around the Cape of Good Hope, French navigators can chart a direct sea route to the legendary ports of the Orient."
 d_fra_indochina_title:0 "Wonders of Indochina"
 d_fra_indochina_desc:0 "Indochina is a land of ancient grandeur, home to magnificent imperial palaces and legendary temple complexes. Restoring and maintaining these grand monuments under French stewardship will elevate our empire's global prestige and solidify our hold over the Orient."
 d_fra_fic_title:0 "Compagnie des Indes"
 d_fra_fic_desc:0 "To effectively manage and expand our growing interests in Asia, a dedicated trading entity is essential. Founding the French East India Company will marshal our national resources, establish factories, and secure our commercial empire."
 FIC:0 "Compagnie des Indes"
 FIC_ADJ:0 "French"
 d_france_algiersculture:0 "Francisation"
