 #basic idee
 d_quality_prof:0 "Professional Force"
 d_quality_prof_desc:0 "By replacing temporary levies with a fully standing military, our soldiers undergo constant drill and tactical instruction, ensuring superior performance on the battlefield."
 d_spy_artillery:0 "Foundry Standards"
 d_spy_artillery_desc:0 "Standardized casting and improved powder ratios maximize the destructive potential of our heavy guns."
 d_spy_guards:0 "Elite Guards"
 d_spy_guards_desc:0 "Stationing hand-picked, veteran guard detachments at vital fortresses and royal courts maintains iron discipline and protects strategic holds against sudden assaults."
 
 #austrianempire
 AUE:0 "Austrian Empire"
 AUE_ADJ:0 "Austrian"
 form_austrian_empire_title:0 "Form the Austrian Empire"
 form_austrian_empire_desc:0 "Our family has guided Europe for generations, yet the title of Emperor cannot rely solely on the votes of German electors. By elevating our ancestral crown to imperial status, we forge a centralized Empire capable of standing strong against rival powers in both the East and the West."
 aue_received:0 "Bulwark of the Realm"
 aue_received_desc:0 "Centuries of defensive warfare against foreign powers have hardened our forces to resist the standard shock of battle and enemy fire. Our regiments stand resilient in the face of devastating onslaughts."
 aue_tradition:0 "Imperial Military Academies"
 aue_tradition_desc:0 "By institutionalizing officer education through prestige establishments like the Theresian Military Academy, we ensure that hard-won operational expertise and strategic tradition are preserved across generations."
 aue_infantry:0 "Grenzer Discipline"
 aue_infantry_desc:0 "Settled along the Military Frontier, our light infantry and line regiments are bred for border skirmishing and tough combat. Their marksmanship and battle discipline give our infantry a fierce reputation."
 aue_development:0 "Core Crownland Infrastructure"
 aue_development_desc:0 "Centralizing investment and internal improvements within our primary Austrian heartlands ensures that regional governance, agriculture, and urban centers thrive with peak economic efficiency."
 AUE_ideas:0 "Austrian Imperial Ideas"
 AUE_ideas_start:0 "Austrian Imperial Traditions"
 AUE_ideas_bonus:0 "Austrian Imperial Ambition"
 d_is_aue:0 "If we form the §OAustrian Empire§! we will gain the following:"
 d_is_auh:0 "However, by forming §OAustria-Hungary§! we will gain the following instead:"
 austrian_dual_monarchy:0 "Austrian Dual Monarchy"
 d_austrian_ability_1:0 "Rapid Imperial Deployments"
 d_austrian_ability_1_desc:0 "The vast and varied geography of the Empire demands that our legions march with utmost haste. By streamlining our supply routes along the Danube and enforcing rigorous marching drills, our armies can cross crown lands swiftly to neutralize threats before they can consolidate."
 d_austrian_ability_2:0 "Indomitable Spirit of the Empire"
 d_austrian_ability_2_desc:0 "A defeat is merely a temporary setback for the House of Habsburg. Supported by deep regional manpower pools and streamlined mobilization centers, our regiments rapidly replace losses and regain fighting spirit, ready to plunge back into the fray before the enemy can exploit their success."
 d_austrian_ability_3:0 "Boost Militarization"
 d_austrian_ability_3_desc:0 "By expanding the purview of the Hofkriegsrat across every province of the realm, state military planning is fully integrated into peacetime governance. Centralized officer training and systematic conscription ensure the Austrian state remains on a permanent, highly disciplined war footing."
 d_austrian_militarized_society:0 "Austrian Militarization"
 ability_d_austrian_militarization_mechanic:0 "Austrian Militarization"
 monthly_d_austrian_militarized_society:0 "Monthly Austrian Militarized Society"