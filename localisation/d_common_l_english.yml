 d_events_brapru.1.title:0 "Purchase of Prussia?""
 d_events_brapru.1.desc:0 "A diplomat from Branderburg arrived today in Warsaw with an offer. We will transfer the ownership of our Prussian vassal to the people of Branderburg, in exchange for some concessions."
 d_events_brapru.1.a:0 "We will accept the deal."
 d_events_brapru.1.b:0 "Are they drunk?"
 d_events_brapru.2.title:0 "The Polish say yes!"
 d_events_brapru.2.desc:0 "They have accepted the deal!"
 d_events_brapru.2.a:0 "Long live Prussia!"
 d_events_brapru.3.title:0 "The Polish say no..."
 d_events_brapru.3.desc:0 "They have declined the offer..."
 d_events_brapru.3.a:0 "Curses! Maybe another time..."
