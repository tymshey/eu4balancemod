 # Keys

 T_GREAT_HWAN:0 "Hwan"
 T_GREAT_HWAN_ADJ:0 "Great Hwan"

 # Ideas

 GOG_ideas:0 "Goguryeo Ideas"
 GOG_ideas_start:0 "Goguryeo Traditions"
 GOG_ideas_bonus:0 "Goguryeo Ambition"

 gog_heirs_to_mandate:0 "Heirs to the Mandate of Heaven"
 gog_heirs_to_mandate_desc:0 "The Goguryeo dynasty has long been a bastion of Confucian order and stability, and we are the rightful heirs to the Mandate of Heaven. By embracing our heritage and asserting our legitimacy, we can strengthen our position in the region and ensure that our dynasty continues to thrive for generations to come."
 gog_metal_movable_type:0 "Metal Movable Type"
 gog_metal_movable_type_desc:0 "The invention of metal movable type has revolutionized the way we produce books and disseminate knowledge. By investing in this technology, we can enhance our cultural influence, promote literacy, and ensure that our ideas and values are preserved for future generations."
 gog_choi_mu_seon_gunpower_engines:0 "Choi Mu-seon's Gunpowder Engines"
 gog_choi_mu_seon_gunpower_engines_desc:0 "Choi Mu-seon's innovative gunpowder engines have the potential to transform our military capabilities. By supporting his research and development, we can enhance our defenses, improve our artillery, and ensure that our forces are well-prepared to protect our interests and expand our influence in the region."
 gog_sino_korean_artisanery:0 "Sino-Korean Artisanry"
 gog_sino_korean_artisanery_desc:0 "The fusion of Chinese and Korean craftsmanship has produced a unique and highly sought-after style of artisanry. By promoting and supporting our artisans, we can create exquisite goods that enhance our cultural influence, boost our economy, and ensure that our traditions are preserved for future generations."
 gog_adapt_the_hyanyak_system:0 "Adapt the Hyanyak System"
 gog_adapt_the_hyanyak_system_desc:0 "The Hyanyak system, a unique method of governance and administration, has proven effective in managing our territories and resources. By adapting and refining this system, we can improve our governance, enhance our efficiency, and ensure that our dynasty continues to thrive in the face of new challenges and opportunities."
 gog_geobukseon:0 "Geobukseon"
 gog_geobukseon_desc:0 "The Geobukseon, or 'turtle ship', is a revolutionary naval vessel that has given us a significant advantage in maritime warfare. By investing in the construction and deployment of these ships, we can strengthen our navy, protect our coastlines, and ensure that our maritime trade and influence continue to flourish in the region."
 gog_academy_of_statecraft:0 "Academy of Statecraft"
 gog_academy_of_statecraft_desc:0 "The Academy of Statecraft is a prestigious institution that trains our future leaders in the art of governance, diplomacy, and strategy. By supporting this academy, we can ensure that our officials are well-prepared to navigate the complexities of statecraft, enhance our diplomatic influence, and secure the prosperity and stability of our dynasty for generations to come."

 SLL_ideas:0 "Silla Ideas"
 SLL_ideas_start:0 "Silla Traditions"
 SLL_ideas_bonus:0 "Silla Ambition"

 sll_unified_korea:0 "Unified Korea"
 sll_unified_korea_desc:0 "The unification of the Korean Peninsula under the Silla dynasty has created a strong and stable foundation for our kingdom. By embracing this legacy and promoting unity, we can strengthen our position in the region, enhance our cultural influence, and ensure that our dynasty continues to thrive for generations to come."
 sll_hoebu:0 "Hoebu"
 sll_hoebu_desc:0 "The Hoebu, a unique system of governance and administration, has proven effective in managing our territories and resources. By refining and adapting this system, we can improve our governance, enhance our efficiency, and ensure that our dynasty continues to thrive in the face of new challenges and opportunities."
 sll_geobukseon:0 "Geobukseon"
 sll_geobukseon_desc:0 "The Geobukseon, or 'turtle ship', is a revolutionary naval vessel that has given us a significant advantage in maritime warfare. By investing in the construction and deployment of these ships, we can strengthen our navy, protect our coastlines, and ensure that our maritime trade and influence continue to flourish in the region."
 sll_masters_of_the_great_expanse:0 "Masters of the Great Expanse"
 sll_masters_of_the_great_expanse_desc:0 "The mastery of the seas has long been a hallmark of our kingdom, allowing us to control trade routes, protect our coastlines, and project our influence across the oceans. By continuing to invest in our naval capabilities, we can ensure that our kingdom remains a dominant maritime power, securing wealth, influence, and knowledge that will endure for generations."
 sll_oceanic_expeditions:0 "Oceanic Expeditions"
 sll_oceanic_expeditions_desc:0 "The seas to the east and south have long been under our control, guiding trade and protecting our coasts. By organizing and supporting ocean expeditions, we can explore distant lands, establish new trade routes, and expand our influence across the oceans, securing wealth, knowledge, and opportunities for our kingdom."
 sll_harmonious_principles:0 "Harmonious Principles"
 sll_harmonious_principles_desc:0 "The peoples of the distant lands we seek to explore and settle are diverse and complex, with their own cultures, traditions, and ways of life. By approaching these peoples with respect, understanding, and a commitment to harmonious relations, we can foster positive interactions, build alliances, and ensure that our settlements thrive in a manner that benefits both our kingdom and the native populations, promoting peace, stability, and prosperity in the regions we seek to influence."
 sll_maritime_commerce:0 "Maritime Commerce"
 sll_maritime_commerce_desc:0 "The seas to the east and south have long been under our control, guiding trade and protecting our coasts. By investing in maritime commerce, we can establish profitable trade routes, enhance our economic influence, and ensure that our kingdom remains a dominant maritime power, securing wealth, knowledge, and opportunities for our people and future generations."
 
 GAY_ideas:0 "Gaya Ideas"
 GAY_ideas_start:0 "Gaya Traditions"
 GAY_ideas_bonus:0 "Gaya Ambition"

 gay_discipline:0 "Discipline of the Common Man"
 gay_discipline_desc:0 "The Gaya confederacy has long been known for its disciplined and hardworking citizens, who contribute to the prosperity and stability of our kingdom. By promoting a culture of discipline and responsibility, we can ensure that our people remain productive, resilient, and committed to the success of our dynasty, securing a bright future for generations to come."
 gay_citizen_militias:0 "Citizen Militias"
 gay_citizen_militias_desc:0 "The Gaya confederacy has long relied on the strength and dedication of its citizen militias to defend our territories and maintain order. By supporting and organizing these militias, we can enhance our military capabilities, protect our people, and ensure that our kingdom remains secure and prosperous in the face of new challenges and opportunities."
 gay_ironworks:0 "Ironworks of Gaya"
 gay_ironworks_desc:0 "The Gaya confederacy has a rich tradition of ironworking, producing high-quality tools, weapons, and goods that are highly sought after. By investing in our ironworks, we can enhance our economic influence, support our artisans, and ensure that our kingdom remains a center of craftsmanship and innovation for generations to come."
 gay_the_grand_council:0 "The Grand Council"
 gay_the_grand_council_desc:0 "The Grand Council of the Gaya confederacy has long been a symbol of our unity, wisdom, and governance. By strengthening and supporting this council, we can ensure that our kingdom remains well-governed, stable, and prosperous, securing a bright future for our people and our dynasty."
 gay_geobukseon:0 "Geobukseon"
 gay_geobukseon_desc:0 "The Geobukseon, or 'turtle ship', is a revolutionary naval vessel that has given us a significant advantage in maritime warfare. By investing in the construction and deployment of these ships, we can strengthen our navy, protect our coastlines, and ensure that our maritime trade and influence continue to flourish in the region."
 gay_southern_trade_league:0 "Southern Trade League"
 gay_southern_trade_league_desc:0 "The Southern Trade League is a powerful alliance of merchants and traders that has long facilitated commerce and exchange across our territories. By supporting and strengthening this league, we can enhance our economic influence, promote trade and innovation, and ensure that our kingdom remains a dominant force in regional commerce for generations to come."
 gay_merchant_financiers:0 "Merchant Financiers"
 gay_merchant_financiers_desc:0 "The Gaya confederacy has long been home to skilled and resourceful merchant financiers, who play a crucial role in supporting trade, investment, and economic growth. By fostering a culture of financial acumen and entrepreneurship, we can ensure that our kingdom remains economically vibrant, resilient, and prosperous, securing wealth and opportunities for our people and future generations."

 BEK_ideas:0 "Baekje Ideas"
 BEK_ideas_start:0 "Baekje Traditions"
 BEK_ideas_bonus:0 "Baekje Ambition"

 bek_planned_urban_expansion:0 "Planned Urban Expansion"
 bek_planned_urban_expansion_desc:0 "The Baekje kingdom has long been known for its well-planned cities and urban centers, which have contributed to our prosperity and cultural influence. By continuing to invest in planned urban expansion, we can enhance our infrastructure, improve the quality of life for our citizens, and ensure that our kingdom remains a vibrant and thriving center of culture and commerce for generations to come."
 bek_elite_royal_guard:0 "Elite Royal Guard"
 bek_elite_royal_guard_desc:0 "The Baekje kingdom has long relied on the strength and dedication of its elite royal guard to protect our rulers and maintain order. By supporting and strengthening this guard, we can enhance our security, safeguard our dynasty, and ensure that our kingdom remains stable and prosperous in the face of new challenges and opportunities."
 bek_scholarly_tradition:0 "Scholarly Tradition"
 bek_scholarly_tradition_desc:0 "The Baekje kingdom has a rich tradition of scholarship and learning, producing scholars, philosophers, and thinkers who have contributed to our cultural and intellectual heritage. By investing in education and supporting our scholars, we can enhance our cultural influence, promote innovation, and ensure that our kingdom remains a center of knowledge and enlightenment for generations to come."
 bek_pursuit_of_perfection:0 "Pursuit of Perfection"
 bek_pursuit_of_perfection_desc:0 "The Baekje kingdom has long been known for its pursuit of perfection in art, architecture, and craftsmanship. By fostering a culture of excellence and supporting our artisans, we can create iconic works that enhance our cultural influence, boost our economy, and ensure that our kingdom remains a center of creativity and innovation for generations to come."
 bek_efficient_administration:0 "Efficient Administration"
 bek_efficient_administration_desc:0 "The Baekje kingdom has long been known for its efficient and effective administration, which has contributed to our stability and prosperity. By continuing to refine and improve our administrative systems, we can enhance our governance, promote economic growth, and ensure that our kingdom remains well-managed and resilient in the face of new challenges and opportunities."
 bek_geobukseon:0 "Geobukseon"
 bek_geobukseon_desc:0 "The Geobukseon, or 'turtle ship', is a revolutionary naval vessel that has given us a significant advantage in maritime warfare. By investing in the construction and deployment of these ships, we can strengthen our navy, protect our coastlines, and ensure that our maritime trade and influence continue to flourish in the region."
 bek_master_artisans:0 "Master Artisans"
 bek_master_artisans_desc:0 "The Baekje kingdom has long been home to master artisans, whose skill and creativity have produced exquisite works of art, architecture, and craftsmanship. By supporting and promoting these artisans, we can enhance our cultural influence, boost our economy, and ensure that our kingdom remains a center of artistic excellence and innovation for generations to come."

