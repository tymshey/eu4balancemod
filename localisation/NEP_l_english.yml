TibetanKingdom:0 "Sikh Empire"
TibetanKingdom_desc:0 "From the foothills of the Himalayas, a new power rises. Having established our dominion in Nepal, we now look beyond the mountains toward the fertile plains of Hindustan. The Khalsa shall no longer remain confined to the lands of Punjab, nor shall its destiny be dictated by distant rulers. Through the unity of the Sikh faith, the strength of our warriors, and the wisdom of enlightened governance, we shall transform our Himalayan kingdom into a mighty empire. Let the mountains be our shield and the rivers our path to conquest. From Nepal, we shall forge a new Sikh Empire, one destined to challenge the great powers of India and reshape the fate of the subcontinent."
