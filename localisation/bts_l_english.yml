 bts_tibetan_conquest_of_china: "Conquest of China"
 desc_bts_tibetan_conquest_of_china: "We have rejected the Son of Heaven and his so-called Mandate and have instead placed the Middle Kingdom under our administration."
 bts_tibetan_zealous_momentum: "Zealous Momentum"
 desc_bts_tibetan_zealous_momentum: "Securing Tibet's internal affairs has unleashed revanchist fervor. We will restore our historical borders and then some!"
 bts_tib_converted_kashmir: "Converted Kashmir"
 desc_bts_tib_converted_kashmir: "We have guided the people of Kashmir back to the path of enlightenment and feel empowered to do the same to others."
