 # --- National ideas ---
 # Genoese ideas
 bts_GEN_ideas: "Genoese Ideas"
 bts_GEN_ideas_start: "Genoese Traditions"
 bts_GEN_ideas_bonus: "Genoese Ambition"
 bts_GEN_mercenaries: "Mercenary Companies"
 bts_GEN_mercenaries_desc: "Genoa never confused military glory with military necessity. When war came, the republic met it practically: hiring the swords it needed, deploying the professionals it kept, and spending no more than the situation demanded. The men who served under the Genoese banner, whether contracted or native, were expected to earn their pay. In a republic run by merchants, that expectation tended to be enforced."
 bts_GEN_bank_of_st_george: "Bank of Saint George"
 bts_GEN_bank_of_st_george_desc: "Founded in 1407 to manage the republic's public debt, the Casa di San Giorgio became something unprecedented: a financial institution so stable, so trusted, and so competently run that it outlasted the republic itself by decades. Machiavelli, no easy flatterer, called it a state within a state. Creditors across Europe learned that a Genoese bond was as good as gold."
 bts_GEN_pragmatic_hospitality: "Pragmatic Hospitality"
 bts_GEN_pragmatic_hospitality_desc: "In the counting houses of Caffa, a Latin merchant might seal a deal in the morning with an Armenian, share a meal at noon with a Muslim grain trader, and settle a dispute in the afternoon before a Genoese consul who cared far more about the weight of the cargo than the content of the prayer. The republic's tolerance was never sentimental. It was simply good business."
 # Fox ideas
 bts_FOX_ideas: "Fox Ideas"
 bts_FOX_ideas_start: "Fox Traditions"
 bts_FOX_ideas_bonus: "Fox Ambition"
 bts_fox_people_of_red_earth: "People of the Red Earth"
 bts_fox_people_of_red_earth_desc: "From red clay Wisaka shaped the first people; the Meskwaki are inseparable from their land."
 bts_fox_masters_of_fox_river: "Masters of the Fox River"
 bts_fox_masters_of_fox_river_desc: "The Fox-Wisconsin Waterway was the commercial spine of New France's interior, and the Meskwaki controlled it."
 bts_fox_fox_wars: "The Fox Wars"
 bts_fox_fox_wars_desc: "Against French extermination orders, the Meskwaki fought on. Their resistance became legend."
 bts_fox_woodland_warfare: "Woodland Warfare"
 bts_fox_woodland_warfare_desc: "The Meskwaki fought in forest and river terrain where European tactics collapsed."
 bts_fox_alliance_of_necessity: "Alliance of Necessity"
 bts_fox_alliance_of_necessity_desc: "Pressed by the French and their native allies, the Fox and Sauk merged their fates."
 bts_fox_purchase_of_tama: "Purchase of Tama"
 bts_fox_purchase_of_tama_desc: "Unlike nearly every other tribe, the Meskwaki bought back their Iowa land and stayed. They never left."
 bts_fox_code_talkers: "Code Talkers"
 bts_fox_code_talkers_desc: "Centuries later, eight Meskwaki served as code talkers in the Pacific. Their language was unbreakable."
 # Malayan ideas
 bts_MSA_ideas: "Malayan Ideas"
 bts_MSA_ideas_start: "Malayan Traditions"
 bts_MSA_ideas_bonus: "Malayan Ambition"
 bts_msa_advanced_ship_warfare: "Advanced Ship Warfare"
 bts_msa_advanced_ship_warfare_desc: "Ours has always been a nation of seafarers, and the benefits of progress have finally arrived to our ships. This new technology should help us to be seen as a serious threat."
 # Papal ideas
 bts_PAP_ideas: "Papal Ideas"
 bts_PAP_ideas_start: "Papal Traditions"
 bts_PAP_ideas_bonus: "Papal Ambition"
