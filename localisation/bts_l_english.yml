 # --- Malaya ---
 # Malayan missions
 bts_msa_religious_unity_title: "Religious Unity"
 bts_msa_religious_unity_desc: "Whether through conversion or tolerance, our people must set aside their religious differences to unite under one rule."
 bts_msa_secure_the_strait_title: "Secure the Strait"
 bts_msa_secure_the_strait_desc: "For centuries, the Strait of Malacca has been the artery through which the wealth of the East flows westward. Spices, silks, and porcelain pass through these narrow waters. Whoever commands the strait commands the trade of half the world. We must make these waters truly ours, so that no merchant ship passes without our blessing, and no coin leaves this region without enriching our coffers."
 bts_msa_secure_philippines_title: "Unite the Philippines"
 bts_msa_secure_philippines_desc: "The islands to our north are a fragmented world: countless petty lords and chieftains, each ruling their own shore, their own river, their own bay. No single power has ever bound them together under one authority. The wealth that passes through Philippine waters is squandered on local squabbles rather than channeled into a common purpose. Let us change that. By bringing these islands under our banner, we extend our reach into the northern seas and deny any rival the foothold they might otherwise find there."
 bts_msa_dominate_spice_trade_title: "Dominate the Spice Islands"
 bts_msa_dominate_spice_trade_desc: "The islands of Maluku have long been known to our merchants. It is from their soil that the clove tree grows. For generations traders have carried their harvest westward through our ports, growing rich on the difference between what they pay and what the world will bear. We must bind Maluku to our realm directly, cultivate its yields, and ensure that the only road from those islands to the wider world runs through us."
 bts_msa_expand_shipyards_title: "Expand Shipyards"
 bts_msa_expand_shipyards_desc: "Our ambitions at sea demand more than the yards we have: more slipways, more craftsmen, more timber seasoned and ready. Let the hammers ring from Malacca to Manila, for the fleet we intend to build has not yet found the ships to sail it."
 bts_msa_exploit_resources_title: "Exploit Our Resources"
 bts_msa_exploit_resources_desc: "The wealth of the [Root.GetName] is not merely in what passes through our ports, but in what grows and is made within our own lands. Our plantations, forges, workshops are the foundation upon which lasting power is built. Let us invest in them seriously, so that the riches we trade in the world are first and foremost our own to sell."
 bts_msa_exploit_resources_reward_tt: "Every province that satisfies these conditions has their §YBase Production§! increased by §G1§!."
 bts_msa_control_trade_title: "Monopolize Trade"
 bts_msa_control_trade_desc: "The strait, the islands, the spice routes... all of it will answer to us. What was once a fragmented web of competing interests will be drawn into a single hand: ours. The world will pay whatever we ask, because we have left them no alternative."
 bts_msa_control_trade_reward_2_tt: "This event will increase the trade value of §YCloves§! and §YSpices§! and give us §Gthree years§! of production income from our provinces in the East Indies producing these goods."
 bts_msa_worthy_trade_fleet_title: "A Worthy Trade Fleet"
 bts_msa_worthy_trade_fleet_desc: "Our trade routes stretch across half the world's spices and silks, yet unescorted merchants are prey for any bold pirate or rival power willing to take the risk. A fleet of nimble vessels, fast enough to chase and strong enough to fight, will make these waters ours in practice as well as name."
 bts_msa_spread_our_faith_title: "Spread Our Faith"
 bts_msa_spread_our_faith_desc: "Tolerance has its place. A realm divided by forced conversion is a realm that bleeds from within, and we have learned that lesson well. But tolerance is a means, not an end.\n\nThe faith that built our civilization, that guides our laws and our prayers, deserves more than mere coexistence. Let it spread, through the patient work of missionaries, through the quiet influence of merchants, through persuasion where it suffices, and through firmer methods where it does not. In time, all lands under our banner will know one faith."
 bts_msa_tame_the_jungles_title: "Tame the Jungles"
 bts_msa_tame_the_jungles_desc: "The jungle is not our enemy. It is our inheritance. Where others see impenetrable wilderness, our engineers and planners see roads not yet cut, settlements not yet raised, and yields not yet harvested. The knowledge won in bending these lands to our will is itself a prize; no other realm has yet learned what we are about to."
 bts_msa_maritime_administration_title: "Maritime Administration"
 bts_msa_maritime_administration_desc: "Our realm has grown beyond what any simple administration can manage, a sprawling network of islands, ports, and sea lanes that demands governance as fluid and far-reaching as the ocean itself. The old ways of managing a land-bound kingdom will not serve us here. We must build something new: a system of administration shaped by the sea, for a people whose destiny has always been written on the water."
 bts_msa_maritime_administration_reward_1_tt: "Unlocks the Tier 1 §YNusantaran Administration§! government reform."
 bts_msa_new_model_army_title: "New Model Army"
 bts_msa_new_model_army_desc: "Our armies have long been the lesser half of our power. That changes now. Drawing on the wealth of our trade and the lessons hard-learned in a lifetime of island warfare, we will remake our forces from the ground up: better drilled, better equipped, and embracing the gunpowder paradigm. We will never be a purely land power, but no enemy should mistake that for weakness."
 bts_msa_naval_supremacy_title: "Naval Supremacy"
 bts_msa_naval_supremacy_desc: "From a handful of trading vessels navigating the Strait of Malacca, we will forge something the world has never seen in these waters: a fleet that can meet any rival, on any sea, and send them to the bottom. [Root.GetName] does not merely trade upon the ocean; we will own it, and every flag that sails these waters does so at our sufferance."
 bts_msa_naval_supremacy_reward_unfulfilled_tt: "If we complete this mission with §YMaritime Ideas§! or §YNaval Ideas§! fully unlocked, we will also halve the necessary requirements for §YNaval Hegemon§!."
 bts_msa_colonize_islands_title: "Colonize the Islands"
 bts_msa_colonize_islands_desc: "The islands of Nusantara are beyond counting: a thousand shores where no [Root.GetAdjective] flag has yet been planted, a thousand bays where our merchants have never dropped anchor. The age of hugging familiar coastlines is over. Our colonists will push into the unmapped periphery, carrying with them the language, the faith, and the commerce of the Malayan world. What nature scattered across the sea, we will bind together by will and by sail."
 bts_msa_expel_ferringhi_title: "Expel the Ferringhi"
 bts_msa_expel_ferringhi_desc: "European traders arrived with honeyed words and a desire to plant their flags and call our shores their own. That era is over. [Root.GetName] is not a market to be carved up by men who sail six months to claim what was never theirs. Let them come to our ports. We will sell them what we choose, at the price we set, through the gates we control. But their forts will be torn down, their governors sent home, and their colonies returned to the peoples they were taken from. They may trade with us, but they may not rule us."
 bts_msa_dream_realized_title: "A Dream Realized"
 bts_msa_dream_realized_desc: "From the narrow strait where this dream was first dared to the farthest islands of the eastern sea, every shore, every harbor, every river mouth will answer to us. What the ancient kings of Srivijaya glimpsed and the sultans of Malacca reached toward will be made whole. The Nusantara will be united under a single banner for the first time in living memory and perhaps for the first time in all of history."

 # Malaya events
 bts_flavor_msa.1.t: "The Nusantaran Spice Monopoly"
 bts_flavor_msa.1.d: "From the counting houses of Cairo to the merchant halls of Venice, the news travels fast: the spice routes of the east have fallen under a single authority. Cloves and pepper. Nutmeg and mace. All now flow exclusively through [Root.GetAdjective] hands. Brokers scramble to secure contracts before prices rise further, while the great trading houses of the west send envoys with honeyed words and open purses. For a generation or more, the perfume of the spice islands will carry with it the unmistakable scent of [Root.GetAdjective] power."
 bts_flavor_msa.1.a: "The spice must flow... through our hands."
 bts_msa_trade_monopoly_tt: "from our provinces in the East Indies superregion that produce §YSpices§! or §YCloves§!."

 # Malayan global modifiers
 bts_msa_expelled_ferringhi: "Expelled the Ferringhi"
 desc_bts_msa_expelled_ferringhi: "The Europeans came to our shores uninvited and presumed to make our waters their own. Their men have been shown the open sea."
 bts_msa_monopolized_spice_trade: "Monopolized Spice Trade"
 desc_bts_msa_monopolized_spice_trade: "We have monopolized the spice trade in the East Indies. Let us hope no one can cultivate their own sources."
 bts_msa_new_model_army: "New Model Army"
 desc_bts_msa_new_model_army: "We have embraced a new paradigm of warfare based on gunpowder and firepower."
 bts_msa_nusantaran_dream_realized: "Nusantaran Dream Realized"
 desc_bts_msa_nusantaran_dream_realized: "What was once a scattered constellation of kingdoms, sultanates, and petty chieftains has been forged into something the world has never seen: a single, unbroken realm stretching across the greatest archipelago on earth. The wealth of a thousand ports, the labor of a hundred peoples, and the weight of history itself now flow in one direction: inward, toward the heart of the Nusantara."
 bts_msa_nusantaran_navy_t1: "Nusantaran Navy"
 desc_bts_msa_nusantaran_navy_t1: "The scattered maritime traditions of [Root.GetName] are being drawn together under a single authority, forging the foundation of a unified fleet."
 bts_msa_nusantaran_navy_upgrade_t2: "Modify '§YNusantaran Navy§!' by:\n  Light Ship Combat Ability: §G+20.0%§!\n  Light Ship Cannons: §G+10.0%§!\n  Ship Trade Power Modifier: §G+10.0%§!"
 bts_msa_nusantaran_navy_t2: "Nusantaran Navy"
 desc_bts_msa_nusantaran_navy_t2: "The [Root.GetAdjective] fleet has found its sea legs. Light, fast vessels now patrol the trade lanes, and bold navigators push ever further into uncharted waters. The foundation is laid; what remains is to crown it with real striking power."
 bts_msa_nusantaran_navy_t3: "Nusantaran Navy"
 bts_msa_nusantaran_navy_upgrade_t3: "Modify '§YNusantaran Navy§!' by:\n  Max Number of Flagships: §G+1§!\n  Marine Force Limit: §G+15.0%§!"
 desc_bts_msa_nusantaran_navy_t3: "The Nusantaran fleet stands as a true naval power, a force that has grown from humble patrol vessels into a mighty armada capable of projecting power across the known seas. At its heart sail the flagships, the pride of the realm and symbols of dominance over every ocean lane from Malacca to the open horizon."
 bts_msa_nusantaran_marines: "Nusantaran Marines"
 desc_bts_msa_nusantaran_marines: "Hardened by years of amphibious warfare across the islands and coasts of the [Root.GetName], our marines are as comfortable boarding an enemy vessel as they are storming a jungle shore."
 bts_msa_settled_islands: "Settled Frontier Islands"
 desc_bts_msa_settled_islands: "Where once there were only jungle shores and empty anchorages, there are now settlements, harbors, and communities bound to the [Root.GetAdjective] world by trade and blood. The frontier has been pushed back, and what was wilderness is now home."
 bts_msa_spreading_our_faith_t1: "Spreading Our Faith"
 desc_bts_msa_spreading_our_faith_t1: "While tolerance has its place, we are now engaging in an active process of spreading our faith far and wide."
 bts_msa_spreading_our_faith_t2: "Spreading Our Faith"
 desc_bts_msa_spreading_our_faith_t2: "While tolerance has its place, we are now engaging in an active process of spreading our faith far and wide."
 bts_msa_tamed_the_jungles: "Tamed the Jungles"
 desc_bts_msa_tamed_the_jungles: "We have managed to inhabit and develop thick jungles to heights never seen before. There is no place we cannot find and settle!"

 # Malayan provincial modifiers
 bts_msa_bulwark_of_the_north: "Bulwark of the North"
 desc_bts_msa_bulwark_of_the_north: "This city has been designated as a naval hub for controlling the northern waters."

 # Other Malayan modifiers
 bts_msa_monopoly_price_change: "Nusantaran Monopoly"

 # --- Nepal ---
 # Nepalese decisions
 bts_npl_move_capital_title: "Move capital to [557.GetName]"
 bts_npl_move_capital_desc: "We have invested much into [557.GetName]. We might as well make it the heart of our nation."

 # Nepalese missions
 bts_npl_religious_direction_title: "Our Religious Direction"
 bts_npl_religious_direction_desc: "Shiva and the Buddha have shared our temples for longer than memory. Kings before us have favored one over the other, and the realm has followed each time. As we forge a single Nepal from many princedoms, the court must finally settle the question our ancestors left open."
 bts_npl_religious_direction_reward_tt: "This event will allow us to commit to either §YHinduism§! or §YVajrayana Buddhism§!. If we change religion, we will automatically convert every owned province in §YHindustan§! to that religion."
 bts_npl_prepare_for_war_title: "Prepare for War"
 bts_npl_prepare_for_war_desc: "The hills of Nepal shelter a dozen petty lords, each jealous of his neighbors and blind to the greater world beyond. If we are to carve a place among the great powers of Bharat, that must change. Our armies must be mustered, our commanders proven, and our counsel wise. The age of isolation ends here."
 bts_npl_establish_bharadar_council_title: "Bharadar Council"
 bts_npl_establish_bharadar_council_desc: "The hill lords who ride with us are warriors, not ministers. To govern our acquisitions, we need men of letters as much as men of arms: Kajis who can administer a province, Chautariyas who can speak for the throne with authority. Let the great families of the realm take their place at court. The Bharadar must be worthy of the kingdom they serve."
 bts_npl_branching_mission_title: "Branching Mission"
 bts_npl_branching_mission_desc: "This mission is a §YBranching Mission§!. Through events or through other missions, this mission will be replaced with a new, final version."
 bts_npl_branching_mission_hindu_triggers_tt: "\nIf §Y[Root.GetName]§! chooses the §YHinduism§! Path, the following triggers will be needed to complete this mission:"
 bts_npl_branching_mission_hindu_effects_tt: "\nIf §Y[Root.GetName]§! chooses the §YHinduism§! Path, the following effects will occur:"
 bts_npl_branching_mission_buddhist_triggers_tt: "\nIf §Y[Root.GetName]§! chooses the §YBuddhism§! Path, the following triggers will be needed to complete this mission:"
 bts_npl_branching_mission_buddhist_effects_tt: "\nIf §Y[Root.GetName]§! chooses the §YBuddhism§! Path, the following effects will occur:"
 bts_npl_asal_hindustan_title: "Asal Hindustan"
 bts_npl_asal_hindustan_desc: "The plains of Hindustan have forgotten what they once were. Generations of foreign rule have left the dharmic order fractured, its temples humbled, and its kings vassals to those who do not share their faith. Nepal has never forgotten. We were never conquered, never converted, never diminished. If Hindustan is to be restored to what it was, it will not be rebuilt from the ruins foreigners leave behind. It will descend from these hills, intact, as it always was."
 bts_npl_asal_hindustan_reward_tt: "We will gain a §YSubjugation§! Casus Belli on all neighboring §YHindu§! countries with less development than §Y[Root.GetName]§!.\n"
 bts_npl_buddhas_homeland_title: "The Buddha's Homeland"
 bts_npl_buddhas_homeland_desc: "From the forests of Lumbini came the Enlightened One, whose teachings spread across Asia and transformed countless realms. Though empires have risen and fallen since his passing, his homeland endures. Let Nepal honor that inheritance by ensuring the Dharma flourishes once again under the protection of the kingdom where it all began."
 bts_npl_yam_between_boulders_title: "Yam Between Boulders"
 bts_npl_yam_between_boulders_desc: "Nepal sits between powers that could swallow us whole: Celestial Emperor to the east and the great kingdoms of Hindustan to the south. A Nepal that picks its enemies carelessly will be ground to dust between them. We must be shrewd where we cannot be strong, and patient where we cannot be bold. The boulder does not crush the yam that learns to grow between its cracks."
 bts_npl_yam_between_boulders_trigger_tt: "No neighboring country has more development than §Y[Root.GetName]§!."
 bts_npl_yam_between_boulders_reward_tt: "\nWe gain the conditional modifier '§YYam Between Two Boulders§!' so long as we have two hostile neighbors that are larger than us. This gives the following effects:\nYearly Army Tradition: §G+1.00§!\nImprove Relations: §G+25.0%§!"
 bts_npl_unify_nepal_title: "Unify Nepal"
 bts_npl_unify_nepal_desc: "One ruler, one banner, one Nepal. We must end the age of petty quarrels. In unity, we can weather the coming storms."
 bts_npl_unify_nepal_no_other_nepali_tt: "No other independent nation has §YNepali§! or §YPahari§! as their primary culture"
 bts_npl_settle_the_valleys_title: "Settle the Valleys"
 bts_npl_settle_the_valleys_desc: "Nepal is more than its battlefields. The valleys between the peaks are fertile, their people industrious, their markets hungry for growth. A kingdom that cannot feed and sustain itself cannot long sustain its ambitions."
 bts_npl_into_the_plateau_title: "Into the Plateau"
 bts_npl_into_the_plateau_desc: "The high plateau beyond our northern passes has long been a source of salt, wool, and silver. But commerce is not the only reason to push north. A frontier drawn along the plateau's edge is a frontier that defends itself: thin air, frozen ground, and a thousand feet of elevation in place of walls and garrisons."
 bts_npl_looking_beyond_title: "Looking Beyond"
 bts_npl_looking_beyond_desc: "The mountains that sheltered us have also confined us. Our kingdom is united, but the fertile lowlands to the south beckon. The great powers of Hindustan have long ignored the highlands, dismissing us as a minor nuisance. Let them continue to underestimate us, while we prepare and replenish."
 bts_npl_develop_kathmandu_title: "Develop Kathmandu"
 bts_npl_develop_kathmandu_desc: "The Kathmandu Valley has long been the heart of Nepal. Now it must become something more: a fortress and seat of administration from which we may govern the hills and guard the passes to the plateau beyond."
 bts_npl_develop_kathmandu_reward_tt: "\nUnlocks a decision to move the capital to §Y[557.GetName]§!."
 bts_npl_law_of_the_land_title: "Law of the Land"
 bts_npl_law_of_the_land_desc: "The Bharadar have their seat at court, but a council without law is merely a room full of ambitious men. The traditions of dharma must be set down and enforced if Nepal is to be more than a collection of conquered hills held together by the threat of Gorkhali steel."
 bts_npl_bharadar_council_upgrade_t2: "Replace '§YBharadar Council§!' with '§YNepali Code§!' and modify it by:\n  Advisor Costs: §G-5.0%§!\n  Monthly Autonomy Change: §G-0.025§!\n  All Estates Influence Modifier: §Y-5.0%§!\n"
 bts_npl_sons_of_the_hills_title: "Sons of the Hills"
 bts_npl_sons_of_the_hills_desc: "The mountains are not merely our home; they are our weapon. Our soldiers have fought in these passes since before any kingdom claimed them. Now we will master what instinct alone has taught us, and turn the high ground into something no enemy can overcome."
 bts_npl_sons_of_the_hills_reward_tt: "Unlocks the conditional modifier '§YHill Warriors§!' so long as our primary culture remains §YNepali§! and our capital is §Y[557.GetName]§!:\nCombat Bonus in Terrain of Capital: §G+1§!\nArmy Drill Gain Modifier: §G+25.0%§!"
 bts_npl_reclaim_hindustan_title: "Reclaim Hindustan"
 bts_npl_reclaim_hindustan_desc: "The plains of Hindustan were once the heartland of dharmic civilization; generations of foreign rule have not extinguished that. We do not come as conquerors but as restorers, and what we take from those who have no rightful claim to it, we return to the people who always called it home."
 bts_npl_establish_bengal_foothold_title: "Bengal Foothold"
 bts_npl_establish_bengal_foothold_desc: "The eastern hills have long been the ragged edge of our reach: fertile lowlands below, trade routes threading north through passes we do not yet command. Bengal is rich, and its northern marches sit unguarded. We need not conquer the whole of it. A foothold in the Terai, a hand on the eastern passes... that is enough for now. The rest will follow."
 bts_npl_vertical_kingdom_title: "Vertical Kingdom"
 bts_npl_vertical_kingdom_desc: "[Root.GetName] is not a rich land in the way the plains are rich. No single crop fills its granaries and no single good fills its markets. What it has instead is variety: the wool of the high pastures, the timber of the middle slopes, the grain of the valley floors. A kingdom that learns to draw on all of it, rather than depend on any one of it, is a kingdom that cannot be starved into submission."
 bts_npl_reform_the_bureaucracy_title: "Reform the Bureaucracy"
 bts_npl_reform_the_bureaucracy_desc: "The law is set down and the court is seated. What remains is to make both mean something. The great families of [Root.GetName] have grown comfortable in the space between counsel and command. That space closes now. The Nepali Code is not a suggestion for ambitious men to interpret as suits them. The Bharadar will serve the crown, or they will not serve at all."
 bts_npl_bharadar_council_upgrade_t3: "Modify '§YNepali Code§!' by:\n  Maximum Absolutism: §G+10.0§!\n  Max effect of Absolutism: §G+10.0%§!\n"
 bts_npl_sword_of_dharma_title: "Sword of Dharma"
 bts_npl_sword_of_dharma_desc: "The dharmic order has no room for two suns. §Y[Root.GetName]§! has carried the flame of Bharat through war and ruin, and what remains is to make certain the world knows it. Let no rival ever forget."
 bts_npl_sword_of_dharma_trigger_tt: "No other nation that has its capital in §YIndia§! has more development than §Y[Root.GetName]§!."

 # Nepalese events
 bts_flavor_npl.1.t: "Whose Dharma Shall Guide the Throne?"
 bts_flavor_npl.1.d: "The consolidation of Nepal has brought more than land beneath one crown. It has brought temple and stupa, Brahman and Vajracharya, under one roof. For generations the valley's kings have moved between Shiva's altars and the Bodhisattva's shrines as suited the moment, and the people have followed wherever the throne leaned. That ambiguity served small kingdoms well enough. It will not serve an empire. The court awaits your word."
 bts_flavor_npl.1.a: "Shiva has always crowned the kings of these hills."
 bts_flavor_npl.1.b: "Let the Vajra's teachings guide Nepal henceforth."

 # Nepalese modifiers
 bts_npl_asal_hindustan: "Asal Hindustan"
 desc_bts_npl_asal_hindustan: "Nepal alone has kept the flame. What we build now, we build on ground that was never lost."
 bts_npl_bharadar_council_t1: "Bharadar Council"
 desc_bts_npl_bharadar_council_t1: "The great families of Nepal have taken their place at court. Their counsel is sharp, their ambitions sharper still."
 bts_npl_bharadar_council_t2: "Nepali Code"
 desc_bts_npl_bharadar_council_t2: "The law of the realm is written, not whispered in the ears of kings by ambitious Kajis. The Bharadar counsel remains, but they do not govern."
 bts_npl_bharadar_council_t3: "Nepali Code"
 desc_bts_npl_bharadar_council_t3: "The law is written and the court has learned to follow it. The great families counsel, the Nepali Code governs, and the crown decides."
 bts_npl_buddhism: "Nepalese Buddhism"
 desc_bts_npl_buddhism: "The Vajra's teachings guide king and court alike."
 bts_npl_custodian_of_dharma: "Custodian of the Dharma"
 desc_bts_npl_custodian_of_dharma: "The preservation of the Dharma is a sacred duty entrusted to each generation. Through faithful stewardship of monasteries, relics, and sacred traditions, [Root.GetName] has become their most trusted custodian, ensuring that the wisdom of the Enlightened One will endure regardless of the fortunes of kings."
 bts_npl_frontier_expansion: "Frontier Expansion"
 desc_bts_npl_frontier_expansion: "Our expansion into the Tibetan plateau has yielded insights into defensive warfare."
 bts_npl_hinduism: "Nepalese Hinduism"
 desc_bts_npl_hinduism: "Shiva reigns from Pashupati's temple, and the throne rules in his name."
 bts_npl_hill_warriors: "Hill Warriors"
 desc_bts_npl_hill_warriors: "Generations of war in the high passes have made our soldiers something no lowland army can match: patient, sure-footed, and deadly on ground of our choosing."
 bts_npl_reclaimed_hindustan: "Reclaimed Hindustan"
 desc_bts_npl_reclaimed_hindustan: "We have reclaimed the heartlands of Hindustan from foreign rule."
 bts_npl_settled_valleys: "Settled the Valleys"
 desc_bts_npl_settled_valleys: "The valley floors yield their harvests, and the markets grow with the labor of the people."
 bts_npl_unified_nepal: "Unified Nepal"
 desc_bts_npl_unified_nepal: "We have unified the Nepalese Princedoms and are pursuing a long-term policy of reconciliation and recovery."
 bts_npl_yam_between_boulders: "Yam Between Two Boulders"
 desc_bts_npl_yam_between_boulders: "Hemmed in by powers greater than ourselves, we have learned what larger kingdoms never needed to: survival is its own form of mastery. Let them underestimate us. It will not last."

 # Nepalese province modifiers
 bts_npl_fertile_lowlands: "Fertile Lowlands"
 desc_bts_npl_fertile_lowlands: "The fertile lowlands yield their harvests under Nepali administration."

 # --- Tibet ---
 # Tibetan missions
 bts_tib_appease_the_dragon_title: "Appease the Dragon"
 bts_tib_appease_the_dragon_desc: "The Emperor of China is an omni-present threat to our region. For now, it might be best to appease them by joining their tributary system."
 bts_tib_appease_the_dragon_reward_tt: "If we complete this mission while maintaining good relations with the emperor, we will have the option to become their tributary.\n"
 bts_tib_mobilize_state_title: "Mobilize the State"
 bts_tib_mobilize_state_desc: "The Tibetan lands are fragmented and vulnerable. We must mobilize to reunite our people and reform the Tibetan Empire!"
 bts_tib_modernize_state_title: "Modernize the State"
 bts_tib_modernize_state_desc: "Our state has lagged behind its neighbors in terms of administrative, diplomatic, and military affairs. We must rectify this if we are to survive."
 bts_tib_stabilize_state_title: "Address Internal Affairs"
 bts_tib_stabilize_state_desc: "If we wish to reclaim the mantle of the Tibetan Empire, we must minimize domestic turmoil. To that end, we must secure the support of our estates, even if that means granting them additional influence."
 bts_tib_economic_foundation_title: "Economic Foundation"
 bts_tib_economic_foundation_desc: "Our nation's finances are quite poor compared to our neighbors. We must secure an economic base for future growth."
 bts_tib_secure_ngari_title: "Secure Ngari"
 bts_tib_secure_ngari_desc: "Ngari serves as an important defensive chokepoint for Tibet. We must secure it if we are to assert our borders."
 bts_tib_secure_lhasa_title: "Secure Lhasa"
 bts_tib_secure_lhasa_desc: "Lhasa is the spiritual and administrative heart of Tibet. We cannot claim the mantle of the Tibetan Empire without it."
 bts_tib_secure_kham_title: "Secure Kham"
 bts_tib_secure_kham_desc: "Kham serves as an important trade hub into China, sitting on the mountain pass to Sichuan and Yunnan. We must secure it."
 bts_tib_unite_tibet_title: "Unite Tibet"
 bts_tib_unite_tibet_desc: "Now that we have secured the heartlands, we must unite the remainder of our people if we are to assert ourselves on the global stage."
 bts_tib_unite_tibet_no_other_tibetan_tt: "No other nation has §YTibetan§! as their primary culture"
 bts_tib_secure_international_title: "International Recognition"
 bts_tib_secure_international_desc: "If Tibet is to endure the centuries to come, it must secure a network of strong and reliable allies."
 bts_tib_secure_international_reward_tt: "Unlocks the conditional modifier '§YReliable Ally§!' while we maintain powerful alliances:\nMonthly Diplomatic Power: §G+1§!"
 bts_tib_fortify_border_title: "Fortify the Border"
 bts_tib_fortify_border_desc: "We must concentrate our efforts toward defending the plateau. We will never be safe until our heartlands are surrounded by a protective shell."
 bts_tib_fortify_border_reward_tt: "Every owned province with a fort building in the Tibetan Region will receive '§YFortification Efforts§!' until the end of the game:\nLocal Defensiveness: §G+25.0%§!\nLocal Fort Maintenance: §G-25.0%§!\n"
 bts_tib_consult_the_lama_title: "Consult the Lama"
 bts_tib_consult_the_lama_desc: "The Dalai Lama is the head of Tibetan Buddhism. Whether or not we wish to submit to his will, our people expect us to consult him in the matters of the state. Before we can request an audience, we must demonstrate our commitment to harmony."
 bts_tib_restore_dzong_title: "Revive Dzong Administration"
 bts_tib_restore_dzong_desc: "A realm as harsh and mountainous as Tibet cannot be governed through loose allegiances alone. The ancient Dzong system once allowed rulers of the plateau to project authority across valleys, passes, and monasteries alike. If we are to preserve the unity of Tibet, these institutions must be restored and strengthened once more."
 bts_tib_renovate_state_title: "Renovate the Plateau"
 bts_tib_renovate_state_desc: "Being situated upon a high and windswept plateau, Tibet has never possessed the wealth of the great realms to our east and south. Without a prosperous heartland, our realm will forever remain vulnerable to fragmentation and decline. If Tibet is to endure, we must learn to master the harsh lands we inhabit and draw prosperity from the roof of the world."
 bts_tib_expand_yaks_title: "The Highland Wool Trade"
 bts_tib_expand_yaks_desc: "The rugged plateau offers few resources in abundance, yet the yak thrives where lesser animals falter. Through organized herding, improved breeding, and expanded wool production, Tibet may transform its highland economy into one capable of supporting a stronger and more prosperous realm."
 bts_tib_expand_yaks_reward_1_tt: "Every §YWool§! province satisfying these conditions in the §YTibet§! region and §YKashmir§! area gets '§YYak Wool Industry§!' until the end of game, giving the following effects:\nLocal Goods Produced: §G+0.25§!\nLocal Goods Produced Modifier: §G+10.0%§!\n\nIn addition, every §YWool§! province satisfying these conditions in the §YTibet§! region and §YKashmir§! area gets their §YProduction Building§! upgraded. If no building is present, add §YWorkshop§!, and if §YCounting House§! is, gain §G2§! Base Production.\n"
 bts_tib_expand_yaks_reward_2_tt: "This event will increase the trade value of §YWool§! and give us §Gthree years§! of production income from our §YWool§! provinces in §YTibet§! and §YKashmir§!."
 bts_tib_reassess_china_title: "Reassess China"
 bts_tib_reassess_china_desc: "The priest-patron bond between Tibet and the Middle Kingdom was never one of equals. China's patronage carried the shadow of suzerainty while Tibet's spiritual authority was always hedged by the proximity of imperial armies. Our realm has grown beyond the need for such arrangements. The Dragon must see us as full equals, yield its heavenly mandate, or be brought to fold by right of our arms. The status quo will do no more."
 bts_tib_reassess_china_reward_tt: "If we complete the mission by being §YEmperor of China§!, we will receive significant mandate growth. If we form a long-term alliance with the Emperor, both nations will receive powerful conditional modifiers. Otherwise, if we conquer China, we will receive three years of production income from all §YSilk§!, §YTea§!, and §YChinaware§! provinces.\n"
 bts_reassess_china_reward_2_tt: "\n§Y[Root.GetName]§! gets the conditional modifier '§YTibetan-Sino Alliance§!' so long as we remain allied to the §YEmperor of China§!, granting us:\nTrade Efficiency: §G+15.0%§!\nTrade Power Abroad: §G+10.0%§!\n\nThe §YEmperor of China§! gets the conditional modifier '§YTibetan-Sino Alliance§!' so long as they remain allied to us, granting them:\nMandate Growth Modifier: §G+0.15§!\nGlobal Prosperity Growth: §G+0.25§!"
 bts_tib_onwards_and_upwards_title: "Onwards and Upwards"
 bts_tib_onwards_and_upwards_desc: "We have centralized our realms, fortified our borders, and sought counsel from the Dalai Lama. Tibet's future now lies beyond its borders. We will bring enlightenment to our neighbors!"
 bts_tib_convert_kashmir_title: "Convert Kashmir"
 bts_tib_convert_kashmir_desc: "Kashmir was not always a stranger to the Dharma. Before the foreign dynasties came, before the old monasteries fell silent, Kashmir was among the greatest centers of Buddhist learning the world had ever known. The masters who shaped our own philosophical tradition walked those valleys. The texts that fill our libraries passed through Kashmir's hands before they reached our plateau. What was lost there was not merely a kingdom. It was a living thread of transmission, severed and forgotten. We intend to restore it."
 bts_tib_tarim_basin_title: "The Tarim Basin"
 bts_tib_tarim_basin_desc: "The Tibetan Empire once stretched across the Tarim Basin and beyond. The nomadic peoples who have come to inhabit the region must accept our rule as we restore our ancient realm."
 bts_tib_enlighten_nepal_title: "Enlighten Nepal"
 bts_tib_enlighten_nepal_desc: "Nepal is our conduit to the subcontinent, and its people must be shown the way of the Buddha and incorporated into our state."
 bts_tib_restore_pala_title: "Restore Pala"
 bts_tib_restore_pala_desc: "Centuries ago, the Pala Kings of Bengal swore their loyalty to the Tibetan Empire. The Pala kingdom is long gone, its dynasty lost to the ages. But perhaps an heir to the kingdom might be 'discovered', and placed upon his rightful throne in fealty to Tibet..."
 bts_tib_burmese_expedition_title: "Burmese Expedition"
 bts_tib_burmese_expedition_desc: "The Buddhist kingdoms of Burma stand between our plateau and the wider world of the Dharma: Theravada schools, ancient lineages, and traditions that diverged from our own centuries ago. We do not march to impose our understanding of the Buddha's teaching upon them. We march to open the road. What follows, whether dialogue, conversion, or simply the shadow of our sovereignty, will be determined in time. The expedition begins here."
 bts_tib_dharmic_unity_title: "Heartland of Dharma"
 bts_tib_dharmic_unity_desc: "India is not merely a conquest. It is the cradle from which the Dharmic faiths emerged and the land to which their sacred geographies belong. To rule here is to assume stewardship over the holiest ground in the world. We will bring these lands under our sovereignty not to extinguish their traditions, but to shelter them beneath a single righteous rule."
 bts_tib_unify_buddhism_title: "Unify Buddhism"
 bts_tib_unify_buddhism_desc: "From Kashmir, where scholars first carried the Buddha's teaching northward to our ancestors on the plateau, to the island kingdoms of the eastern sea: the Buddhist world is vast, fractured, and in need of a sovereign head. We have inherited a tradition that once moved empires. It is time to ensure that no Buddhist kingdom stands apart from our protection, and that the tradition our forebears received from Kashmir's great monasteries flows outward again from Lhasa to every shore it has touched."
 bts_tib_unify_buddhism_no_other_buddhist_tt: "No other independent §YBuddhist§! nation exists"
 bts_tib_chakravartin_reign_title: "Chakravartin Reign"
 bts_tib_chakravartin_reign_desc: "The dharmachakra was set in motion the moment our realm turned its gaze beyond the plateau. The texts speak of the Chakravartin, the wheel-turning monarch whose sovereignty over all of Jambudvipa is granted not by conquest alone, but by the weight of accumulated merit and the righteousness of his rule. Our armies have carried the wheel to the shores of distant seas. It remains only to let it complete its turning."

 # Tibetan events
 bts_flavor_tib.1.t: "The Emperor Takes Notice"
 bts_flavor_tib.1.d: "The Son of Heaven has taken notice of our overtures. Though Tibet remains distant from the heartlands of China, the influence of the Emperor cannot be ignored. Some among our court argue that joining the tributary order would secure peace, favorable relations, and recognition of our autonomy. Others warn that even symbolic submission may invite future interference in Tibetan affairs.\n\nFor now, the Emperor offers harmony instead of coercion. The question before us is whether we shall accept his protection and place within the celestial order, or maintain a more distant relationship."
 bts_flavor_tib.1.a: "Accept our place within the tributary order."
 bts_flavor_tib.1.b: "We shall remain outside the Emperor's sphere."
 bts_flavor_tib.2.t: "Masters of the Yak"
 bts_flavor_tib.2.d: "For centuries, the yak has been indispensable to life upon the Tibetan plateau, providing wool, milk, labor, and transport across even the harshest terrain. By expanding the breeding and domestication of these hardy beasts, we may strengthen the prosperity of our highland communities and bring Tibetan wool to markets far beyond the Himalayas."
 bts_flavor_tib.2.a: "Fantastic."
 bts_tib_yak_wool_tt: "from our provinces in Tibet and Kashmir that produce §YWool§!."

