 # --- Generic events ---
 # Bat attack!
 bts_bat_swarm.1.t: "The Night the Sky Turned Black"
 bts_bat_swarm.1.d: "Without warning, a vast colony of bats has erupted from the caves of [bat_swarm_province.GetName], darkening the skies for miles. Crops are ruined, livestock scattered, and the people speak of omens. Local authorities are at a loss."
 bts_bat_swarm.1.a: "Drive the creatures back!"
 bts_bat_swarm.1.b: "...perhaps they will move on."
 bts_bat_swarm.4.t: "The Return of the Bats"
 bts_bat_swarm.4.d: "The bats have returned to [bat_swarm_province.GetName], although not with the fury of before. This time they circle lazily overhead, roost in the church steeple, and steal grain from open windows. The people mutter darkly. The local pastor has begun his third sermon on the subject. No one is surprised. No one is happy."
 bts_bat_swarm.4.a: "Not again..."
 bts_bat_swarm.4.b: "Get rid of them once and for all!"
 bts_bat_swarm_devastation: "Bat Devastation"
 desc_bts_bat_swarm_devastation: "Bats have terrorized this province and defiled the lands for years to come."
 bts_bat_swarm_risk: "Bat Swarm Risk"
 desc_bts_bat_swarm_risk: "The unchecked devastation wrought by bats has the locals concerned about another attack."
 bts_bat_wars_victory: "Victors of the Bat Wars"
 desc_bts_bat_wars_victory: "Twice the skies darkened. Twice the bats came. Twice, [This.GetName] endured. Local historians called it a war. No one has corrected them."
 # DomesticFox
 bts_domesticfox.1.t: "The Usefulness of Foxes"
 bts_domesticfox.1.d: "Foxes are often considered a local nuisance. They dig through refuse, uproot gardens, and generally cause trouble wherever they roam.\n\nFortunately for us, we possess a domesticated Fox of our own. Though troublesome at times, its unusual cleverness has proven surprisingly exploitable in matters of war and intrigue."
 bts_domesticfox.1.a: "A clever beast indeed."
 bts_domesticfox.2.t: "Losing Our Pet"
 bts_domesticfox.2.d: "Our domesticated Fox has slipped from our grasp. Whether through escape, betrayal, or simply wandering off, we can no longer rely upon its peculiar talents."
 bts_domesticfox.2.a: "Oh, for Fox's sake."
 bts_pet_fox_modifier: "Domesticated Fox"
 desc_bts_pet_fox_modifier: "Our pet Fox has proven quite useful."
 # Cannibal dynasty
 bts_cannibal_dynasty.1.t: "A Taste for the Forbidden"
 bts_cannibal_dynasty.1.d: "Whispers spread through the court like spilled wine, dark and impossible to fully wipe away. It began, as these things often do, with a rumor too strange to be believed: a servant who never returned from the royal kitchens, a guardsman who swore he saw [Root.Monarch.GetTitle] [Root.Monarch.GetName] dine alone on something that was not meat from any market stall.\n\nNo one dares confront [Root.Monarch.GetName] directly. But the stewards have started locking the larder at night, and the priests mutter prayers when the ruler passes. Whatever the truth of it, the court now knows something that cannot be unknown, and word of it will not stay within these walls for long."
 bts_cannibal_dynasty.1.a: "...delicious!"
 bts_cannibal_dynasty.2.t: "The Curse Is Broken"
 bts_cannibal_dynasty.2.d: "The old blood has run its course. Whatever madness or ancient corruption drove our former rulers to consume the flesh of their fellow man has not passed to the new dynasty. Priests proclaim the realm cleansed, while the common folk cautiously dare to believe that the terrible hunger has finally been banished."
 bts_cannibal_dynasty.2.a: "Breathe a sigh of relief."
 # Rape of Hanseong
 bts_rape_of_korea.1.t: "No Quarter at [735.GetName]"
 bts_rape_of_korea.1.d: "The relentless siege of [735.GetName] has finally broken the city's formidable defenses, but the victory brings no glory. Months of throwing men against the towering walls of the capital have bred a dark, festering resentment within our ranks. As the fortress gates finally splintered, the exhausted and embittered soldiers abandoned all discipline. Driven by the sheer frustration of the protracted siege, the army poured into the city streets, unleashing a torrent of unchecked vengeance upon the defenders and the populace alike.\n\n[735.GetName] has been subjected to a brutal and systematic sacking. Grand palaces and historic districts have been reduced to ashes, centuries of infrastructure undone in mere days, and the city completely stripped of its wealth. The stubbornness of the defenders has been paid for with the absolute devastation of their jewel."
 bts_rape_of_korea.1.a: "Let the city burn."
 bts_rape_of_korea.1.b: "Stop this madness! Rein them in!"

 # Generic personalities
 bts_cannibal_personality: "Cannibal"
 desc_bts_cannibal_personality: "This ruler is a Cannibal. Thinking that other people make the best of meals, our ruler has engaged in the scandalous act of consuming human flesh."
 bts_cannibal_personality_die_desc: "[Root.Monarch.GetHerHisCap] evil deeds shall be remembered for generations to come."

 # Generic decisions
 bts_purge_cannibal_taint_title: "Purge the Cannibal Taint"
 bts_purge_cannibal_taint_desc: "Cannibalism taints our dynasty's history and reputation. We must make a show of denouncing our past if we are to move on."

