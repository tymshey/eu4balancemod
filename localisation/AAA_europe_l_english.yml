 # Austria
 hab_imperial_trade_interests_title:0 "Imperial Trade Interests"
 hab_imperial_trade_interests_desc:0 "The monetization of our rural lands has flooded our cities with liquid wealth and an eager, newly mobile labor pool. To harness this unprecedented surge of private wealth, we must look beyond traditional guilds and establish the legal foundations for urban industrial capitalism. By chartering a centralized stock exchange and legalizing joint-stock corporations, we enable private investors, wealthy burghers, and even reform-minded nobles to freely pool their capital. This creates an unstoppable investment engine capable of financing massive commercial ventures, private manufacturing plants, and sprawling infrastructural projects across the empire without draining the imperial treasury."

 # Events

 flavor_ukraine.1.title:0 "The Euromaidan"
 flavor_ukraine.1.desc:0 "The centuries of fragmentation, foreign yoke, and internal strife have finally come to an end. From the fertile steps of Ukraine to the deep forests of Belarus, the land of the Rus' has been reunified under the banner of Ruthenia. As our new capital celebrates this historic triumph, the boyars, Cossacks, and common folk gather in the center of Kiev to witness the birth of our state. However, the fundamental question remains: how shall the newly reborn Ruthenia be governed? The choices we make today will echo through the ages and define the soul of our people."
 flavor_ukraine.1.a:0 "Proclaim a Tsardom"
 flavor_ukraine.1.b:0 "Proclaim a Republic"
 flavor_ukraine.1.c:0 "Proclaim a Peasant Republic"