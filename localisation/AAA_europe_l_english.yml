 # Spain
 spa_the_royal_galleon_title:0 "The Royal Galleon"
 spa_the_royal_galleon_desc:0 "As our maritime might grows, so do our needs. We need to make modifications to the royal galleon design, so it becomes even more fearsome than it is today."
 gc_cas_spa_royal_indian_company_title:0 "The Royal Indian Company"
