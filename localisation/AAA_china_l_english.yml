 t_china_events.11.title:0 "Centre of Islamic Culture in Kashgar"
 t_china_events.11.desc:0 "At the western edge of the Celestial Empire lies Kashgar, a city where caravans converge and cultures meet. Long a hub of Islamic scholarship, trade, and administration, it stands as a bridge between China and the lands beyond the mountains. Mosques, schools, and markets thrive together, drawing scholars and merchants from across Central Asia.\n\nSome at court see Kashgar as an asset, a center of learning and diplomacy that strengthens ties with distant regions and enriches the empire. Others view its distinct traditions with suspicion, fearing that such influence may challenge imperial cohesion."
 t_china_events.11.a:0 "Magnificent!"

 t_china_events.12.title:0 "Legacy of the Steppe and the Faithful"
 t_china_events.12.desc:0 "The Celestial Empire has long ruled over peoples of many faiths, but none embraced this reality more fully than the Yuan. Under their rule, Muslims, Buddhists, and others served the state openly, strengthening trade, administration, and ties to distant lands. Though their dynasty has fallen, this legacy endures as a reminder that unity need not require uniformity.\n\nNow, as we govern under Heaven’s Mandate, the court must decide whether to follow this path of tolerance or pursue a more rigid order."
 t_china_events.12.a:0 "All faiths serve under Heaven."

 t_china_events.13.title:0 "Founding of Shanghai"
 t_china_events.13.desc:0 "Shanghai, a city of great importance and potential, has been established as a center of trade and commerce. Its strategic location and growing influence make it a key asset in our efforts to expand our reach and strengthen our economy. As we look to the future, Shanghai stands as a symbol of our ambition and a gateway to new opportunities."
 t_china_events.13.a:0 "The City of Dreams!"

 t_china_events.14.title:0 "The Schools of Thought"
 t_china_events.14.desc:0 "The intellectual landscape of our empire is rich and diverse, with various schools of thought vying for influence at court. The Cheng Zhu School, with its emphasis on moral cultivation and social harmony, has gained significant traction among the scholars and officials. Meanwhile, the Xunzi School, which focuses on human nature and social order, also has its proponents. As we navigate the complexities of governance, the court must decide which philosophical path to follow, shaping the future of our empire and the legacy we leave for generations to come."
 t_china_events.14.a:0 "Embrace the Cheng Zhu School."
 t_china_events.14.b:0 "Embrace the Xunzi School."
 t_china_events.14.c:0 "Embrace the Mengzi School."
 t_china_events.14.d:0 "Embrace the Xinxue School."
 t_china_events.14.e:0 "Embrace the Daoxue School."
 t_china_events.14.f:0 "Embrace the Jingxue School."

 # Ideas

 # Qing ideas

 qng_huoqiying:0 "Huoqiying Cavalry"
 qng_huoqiying_desc:0 "The Huoqiying Cavalry is a specialized military unit that has been trained in the use of firearms and mounted combat. This unit is highly effective against both infantry and cavalry, making it a formidable force on the battlefield."

