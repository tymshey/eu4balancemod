 # Tang ideas

 t_TNG_ideas:0 "Great Tang Ideas"
 t_TNG_ideas_start:0 "Great Tang Traditions"
 t_TNG_ideas_bonus:0 "Great Tang Ambition"

 t_golden_governance:0 "Golden Governance"
 t_golden_governance_desc:0 "The Tang dynasty is renowned for its effective and enlightened governance, which has allowed it to flourish as one of the most powerful and culturally rich empires in history. By adopting the principles of Golden Governance, we can enhance our administrative efficiency, promote social harmony, and foster economic prosperity. This idea represents our commitment to learning from the best practices of the Tang dynasty, ensuring that our own governance is marked by wisdom, fairness, and a dedication to the well-being of our people."
 t_revival_of_the_silk_road:0 "Revival of the Silk Road"
 t_revival_of_the_silk_road_desc:0 "The Silk Road was a vast network of trade routes that connected the East and West, facilitating the exchange of goods, ideas, and cultures. By reviving the Silk Road, we aim to restore this vital artery of commerce and cultural exchange, enhancing our economic strength and international influence. This idea reflects our ambition to reestablish China as a central hub of global trade, fostering prosperity and cultural richness through renewed connections with distant lands."
 t_celestial_bureaucracy:0 "Celestial Bureaucracy"
 t_celestial_bureaucracy_desc:0 "The Celestial Bureaucracy is a system of governance that emphasizes meritocracy, efficiency, and the harmonious functioning of the state. By embracing the principles of the Celestial Bureaucracy, we can strengthen our administrative institutions, promote capable leadership, and ensure that our government operates with integrity and effectiveness. This idea represents our commitment to upholding the highest standards of governance, drawing inspiration from the historical legacy of China's imperial administration."
 t_grand_imperial_army:0 "Grand Imperial Army"
 t_grand_imperial_army_desc:0 "The Grand Imperial Army is a formidable military force that has historically protected the Chinese empire from external threats and maintained internal stability. By adopting the principles of the Grand Imperial Army, we can enhance our military capabilities, improve our strategic planning, and ensure the security of our nation. This idea reflects our dedication to building a strong and disciplined military, capable of defending our sovereignty and advancing our national interests."
 t_imperial_navy:0 "Imperial Navy"
 t_imperial_navy_desc:0 "The Imperial Navy has played a crucial role in safeguarding China's maritime interests and projecting power across the seas. By embracing the principles of the Imperial Navy, we can strengthen our naval forces, enhance our maritime capabilities, and secure our trade routes. This idea represents our commitment to building a powerful navy that can protect our coastal regions, support our economic growth, and assert our influence on the global stage."
 t_golden_age_of_engineering:0 "Golden Age of Engineering"
 t_golden_age_of_engineering_desc:0 "The Tang dynasty is celebrated for its remarkable achievements in engineering and technological innovation. By embracing the principles of the Golden Age of Engineering, we can foster a culture of innovation, improve our infrastructure, and advance our technological capabilities. This idea reflects our commitment to harnessing the power of engineering to drive progress, enhance our quality of life, and secure our position as a leading nation in the modern world."
 t_all_under_heaven:0 "All Under Heaven"
 t_all_under_heaven_desc:0 "The concept of 'All Under Heaven' embodies the ideal of a harmonious and unified world under the benevolent rule of the Chinese emperor. By embracing this ideal, we can promote peace, stability, and cooperation among nations, fostering a global community that thrives on mutual respect and shared prosperity. This idea reflects our aspiration to lead by example, demonstrating the values of harmony and unity in our interactions with the world."

 # Liang ideas

 t_LNG_ideas:0 "Great Liang Ideas"
 t_LNG_ideas_start:0 "Great Liang Traditions"
 t_LNG_ideas_bonus:0 "Great Liang Ambition"

 t_lng_guarding_the_frontiers:0 "Guarding the Frontiers"
 t_lng_guarding_the_frontiers_desc:0 "Our dynasty has been committed to safeguarding its borders and protecting its people from external threats. By adopting the principles of Guarding the Frontiers, we can enhance our defensive capabilities, strengthen our military presence along our borders, and ensure the security of the nation."
 t_lng_inwards_perfection:0 "Inwards Perfection"
 t_lng_inwards_perfection_desc:0 "Inwards Perfection is a philosophy that emphasizes the importance of internal development and self-improvement. By embracing this philosophy, we can focus on strengthening our internal affairs, promoting social harmony, and fostering economic prosperity."
 t_lng_shenbigong:0 "Shenbigong Regiments"
 t_lng_shenbigong_desc:0 "The Shenbigong is an elite unit of soldiers equipped with the repeating crossbow, a powerful weapon that can unleash a rapid barrage of bolts on the enemy. The Shenbigong regiments are exceptionally powerful against both infantry and cavalry, making them a formidable force on the battlefield."

 # Missions

 # General China Missions

 t_china_build_shipyards_title:0 "Support the Naval Industry"
 t_china_build_shipyards_desc:0 "The naval industry is crucial for our nation's defense and economic growth. By investing in the construction of shipyards, we can enhance our naval capabilities, create jobs, and stimulate economic development."
 t_china_build_shipyards_tt:0 "Every owned coastal province in the §YChina§! Superregion will recieve:"
 t_china_the_silk_of_china_title:0 "The Silk of China"
 t_china_the_silk_of_china_desc:0 "The silk industry has been a cornerstone of our economy and culture for centuries. By supporting the silk industry, we can boost our economic growth, create jobs, and preserve an important aspect of our heritage."

 # Qing Missions
 
 mch_ensure_internal_stability_tt:0 "We will gain access to the Tribes estate\n"
 qng_kashgar_pass_title:0 "Kashgar Pass"
 qng_kashgar_pass_desc:0 "Kashgar, located at the western edge of the Celestial Empire, has long been a vital hub of trade and culture. By establishing the Kashgar fortress, we can strengthen our control over this strategic region, enhance our trade networks, and promote cultural exchange with neighboring territories."
 
 # Yuan Missions

 t_yua_build_shipyards_title:0 "Support the Naval Industry"
 t_yua_build_shipyards_desc:0 "The naval industry is crucial for our nation's defense and economic growth. By investing in the construction of shipyards, we can enhance our naval capabilities, create jobs, and stimulate economic development."
 #this one's a tooltip so we do not need it here
 t_yua_the_silk_of_china_title:0 "The Silk of China"
 t_yua_the_silk_of_china_desc:0 "The silk industry has been a cornerstone of our economy and culture for centuries. By supporting the silk industry, we can boost our economic growth, create jobs, and preserve an important aspect of our heritage."
 yua_project_strength_title:0 "Era of The Great Dragon"
 yua_project_strength_desc:0 "The Dragon is a symbol of power and strength in Chinese culture. By embarking on the mission to project our strength abroad, we can harness the spirit of the Great Dragon to enhance our military capabilities, boost our national pride, and assert our dominance on the global stage."
 yua_weaving_gold_and_silk_title:0 "Weaving, Gold & Silk"
 yua_weaving_gold_and_silk_desc:0 "The Silk Road was a vital trade route that connected China to the rest of the world, facilitating the exchange of goods, ideas, and culture. By revitalizing the Silk Road, we can boost our economy, strengthen our diplomatic ties, and promote cultural exchange with other nations."
 yua_restore_xanadu_title:0 "Restore Xanadu"
 yua_restore_xanadu_desc:0 "Xanadu, the summer capital of Kublai Khan, was a symbol of the grandeur and cultural richness of the Yuan dynasty. By restoring Xanadu, we can revive this historical site as a center of culture and learning, attracting scholars and artists from around the world."

 # Tang Missions

 t_tng_restore_chang_an_title:0 "Restore Chang'an"
 t_tng_restore_chang_an_desc:0 ""
 t_tng_inward_perfection_title:0 "Inward Perfection"
 t_tng_inward_perfection_desc:0 "Many advisory voices in our palace advocate in favor of a movement that focuses on perfecting our internal affairs instead of chasing conquest far and wide. However, a new movement within our realm opposes the former, underlaying that we must strike while the iron is hot and smite the enemies who seek to destroy it, before they are able to amass strength to challenge us."
 t_tng_crisis_of_dynasty_title:0 "Crisis of the Tang Dynasty"
 t_tng_crisis_of_dynasty_desc:0 "Our dynasty has been through many terrifying crises. Perhaps this is a sign of the Heavens testing our head of state. Nevertheless, we must persevere in the face of danger and not falter. The future of our people hangs in tis balance."

