 # Religion

 chengzhu_school:0 "Cheng Zhu"
 chengzhu_school_desc:0 "The Cheng Zhu School, also known as the Neo-Confucian School, is a philosophical movement that emerged during the Song dynasty. It emphasizes the importance of moral cultivation, social harmony, and the pursuit of knowledge."
 chengzhu_scholar_modifier:0 "Cheng Zhu Scholar"
 chengzhu_scholar_modifier_desc:0 ""
 xunzi_school:0 "Xunzi"
 xunzi_school_desc:0 "The Xunzi School is a philosophical movement that emerged during the Warring States period. It emphasizes the importance of human nature, social order, and the role of ritual in maintaining harmony."
 xunzi_school_modifier:0 "Xunzi Scholar"
 xunzi_school_modifier_desc:0 ""
 mengzi_school:0 "Mengzi"
 mengzi_school_desc:0 "The Mengzi School, also known as the Mencius School, is a philosophical movement that emerged during the Warring States period. It emphasizes the importance of moral cultivation, benevolence, and the role of education in shaping virtuous individuals."
 mengzi_school_modifier:0 "Mengzi Scholar"
 mengzi_school_modifier_desc:0 ""
 xinxue_school:0 "Xinxue"
 xinxue_school_desc:0 "The Xinxue School, also known as the School of Mind, is a philosophical movement that emerged during the Song dynasty. It emphasizes the importance of self-cultivation, introspection, and the pursuit of inner wisdom."
 xinxue_school_modifier:0 "Xinxue Scholar"
 xinxue_school_modifier_desc:0 ""
 daoxue_school:0 "Daoxue"
 daoxue_school_desc:0 "The Daoxue School, also known as the School of the Way, is a philosophical movement that emerged during the Warring States period. It emphasizes the importance of following the natural order, cultivating virtue, and living in harmony with the Dao."
 daoxue_school_modifier:0 "Daoxue Scholar"
 daoxue_school_modifier_desc:0 ""
 jingxue_school:0 "Jingxue"
 jingxue_school_desc:0 "The Jingxue School, also known as the School of Classics, is a philosophical movement that emerged during the Han dynasty. It emphasizes the importance of studying the Confucian classics, moral cultivation, and the pursuit of knowledge."
 jingxue_school_modifier:0 "Jingxue Scholar"
 jingxue_school_modifier_desc:0 ""

