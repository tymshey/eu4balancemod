l_english:
 brit_USA_ideas:0 "United States Ideas"
 brit_USA_ideas_start:0 "American Traditions"
 brit_USA_ideas_bonus:0 "American Ambition"
 usa_continental_army:0 "Continental Army"
 usa_continental_army_desc:0 "The continental army, comprising of mostly local militias, will ensure that we have a steady supply of battle-ready soilders in place of a professional army."
 usa_land_grants:0 "Land Grants"
 usa_land_grants_desc:0 "Granting land rights to our citizens encourages internal improvement of our buildings at less cost to the government."
 usa_new_frontiers:0 "New Frontiers"
 usa_new_frontiers_desc:0 "Our expansion westward has allowed us to settle vastly undeveloped, yet extremely habitable lands. We must dedicate resources to developing these new lands."
 usa_national_roads:0 "National Roads"
 usa_national_roads_desc:0 "With our ever growing extent, it is vital that we have roads to connect our numerous states together."

 usa_american_frontier_title:0 "[Root.GetAdjective] Frontier"
 usa_manifest_destiny_title:0 "Manifest Destiny"
 usa_manifest_destiny_desc:0 "It is the birthright of this [Root.GetAdjective] nation to reach from sea to shining sea."

 usa_american_industralization_title:0 "[Root.GetAdjective] Industralization"
 usa_american_industralization_desc:0 "Our industrial capacity is rapidly expanding, establishing ourselves as an emerging economic powerhouse."
 usa_fur_trade_title:0 "Fur Trade"
 usa_fur_trade_desc:0 "The Hudson Bay Company proved how profitable exploiting the fur trade is. We must develop our own domestic industry to challenge foreign markets."

 usa_founding_fathers_title:0 "Founding Fathers"
 usa_founding_fathers_desc:0 "By having such competent and intelligent leaders at the helm of the founding of our country, we can ensure a strong precedent in our leadership for many years to come."
 usa_meritocratic_administration_title:0 "Meritocratic Administration"
 usa_meritocratic_administration_desc:0 "We are unmatched by having an administration appointed on merit as opposed to one's connections. Therefore, we can expect a high level of competency in our [Root.GovernmentName]."
 usa_acts_of_congress_title:0 "Acts of Congress"
 usa_acts_of_congress_desc:0 "Our Congress has shown itself to be imperative to moving the [Root.GetAdjective] nation forward."
 usa_the_white_house_title:0 "The White House"
 usa_the_white_house_desc:0 "It is vital that we have a glamarious residence for our [Root.GetTitle]. It will serve as the beating heart of the [Root.GetAdjective] nation."
 usa_harvard_university_title:0 "Harvard University"
 usa_harvard_university_desc:0 "A great [Root.GovernmentName] requires great leadership. We must ensure that we have the facilities to ensure the next generation can assume the mantle."
 usa_secretary_of_state_title:0 "Secretary of State"
 usa_secretary_of_state_desc:0 "The diplomatic skill of our secretary of state ensures that we maintain good foreign relations."
 
 usa_form_a_standing_army_title:0 "Form a Standing Army"
 usa_form_a_standing_army_desc:0 "We may have founded the [Root.GetAdjective] nation, but now we must defend it. We must establish a standing army to repel any foreign attack."
 usa_prove_our_might_title:0 "Prove Our Might"
 usa_prove_our_might_desc:0 "By winning glorious victories on the battlefield, we have proven that we are no mere pushovers."
 usa_legion_of_america_title:0 "Legion of America"
 usa_legion_of_america_desc:0 "Our army has grown to a size that cannot be ignored by foreign powers. This has allowed for a new level of professionalism that we will harness should we need to."
 usa_unite_the_northeast_title:0 "Unite the Northeast"
 usa_unite_the_northeast_desc:0 "We have united our home region, firmly establishing our presence as a nation."
 usa_east_coast_dominance_title:0 "East Coast Dominance"
 usa_east_coast_dominance_desc:0 "With the entire eastern coast of America under our control, we find ourselves an emerging power in the global stage. We must continue our expansion westward."
 usa_reach_the_west_title:0 "Reach the West"
 usa_reach_the_west_desc:0 "Manifest destiny ensures that the [Root.GetAdjective] nation is destined to reach from the east and western coasts of the new world. This dream is now a reality."
 usa_master_of_north_america_title:0 "Master of North America"
 usa_master_of_north_america_desc:0 "Our influence over the New World is unmatched. We shall ensure that the [Root.GetAdjective] nation remains free and strong, and expel anyone that tries to challenge us."
 usa_seize_hawaii_title:0 "Seize Hawaii"
 usa_seize_hawaii_desc:0 "Hawaii sits right at the center of the Pacific. It is vital that we seize this land and then develop it into a forward naval base should we try to expand our influence into Southeast Asia."

 usa_port_of_new_york_title:0 "Port of [965.GetAreaName]"
 usa_port_of_new_york_desc:0 "[965.GetAreaName] is a natural location to house a grand port for our nation. We must develop this area into the heart of our naval power and trade."
 usa_establish_a_trade_fleet_title:0 "Establish a Trade Fleet"
 usa_establish_a_trade_fleet_desc:0 "We must establish a standing trade fleet to make our presence in the seas known."
 usa_an_american_armada_title:0 "An [Root.GetAdjective] Armada"
 usa_an_american_armada_desc:0 "By building a fleet to unparalleled margins, we will send back anyone who dares challenge us in the seas."
 usa_influence_the_caribbean_title:0 "Influence the Caribbean"
 usa_influence_the_caribbean_desc:0 "The Caribbean has been a center of trade and exploitation for some time now. We would be fools not to carve our forward our interests in the region."
 usa_freedmens_colony_title:0 "Freedman's Colony"
 usa_freedmens_colony_desc:0 "Sending former enslaved people to establish colonies in the Gold Coast will grant us a foothold in the region, and new trade opportunities."

