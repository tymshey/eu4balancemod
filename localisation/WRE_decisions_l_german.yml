l_german:
    restore_western_roman_empire_title:0 "Weströmisches Reich wiederherstellen"
    restore_western_roman_empire_desc:0 "Seit den Römern des zweiten Jahrhunderts hat kein Reich mehr den gesamten Mittelmeerraum und die Gebiete darüber hinaus beherrscht. Auch wir besitzen zu wenig, um uns als vollständigen Nachfolger des römischen Reiches zu proklamieren, aber immerhin können wir den westlichen Teil wieder vereinen."
    restore_western_roman_empire_tt:0 "Alle Provinzen in Eurem Besitz werden nicht mehr Teil des Heiligen Römischen Reichs sein."