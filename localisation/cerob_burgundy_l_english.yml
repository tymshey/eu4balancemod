l_english:
#Events

 new_flavour_bur.8.t:0 "Fate of Liege"
 new_flavour_bur.8.d:0 "Liege is a potencial target of our expansion, but we have great relations with each other. We have to choose between a great friend or expansion."
 new_flavour_bur.8.a:0 "Ask them to bacome a vassal!"
 new_flavour_bur.8.b:0 "We cannot risk our alliance."
 
 new_flavour_bur.9.t:0 "Burgundy ask to become a vassal"
 new_flavour_bur.9.d:0 "Burgundian state send us an envelope where they ask to became their subject. Our great relations should be untouched or we have to change our interpretations against Burgundy."
 new_flavour_bur.9.a:0 "I accept!"
 new_flavour_bur.9.b:0 "Refuse."
 
 new_flavour_bur.10.t:0 "Liege Accepted"
 new_flavour_bur.10.d:0 "Liege has no became our vassal, hope they are not change mind in the future."
 new_flavour_bur.10.a:0 "Our friendship is long lasting!"
 
 new_flavour_bur.11.t:0 "Liege Refused"
 new_flavour_bur.11.d:0 "Liege refused our offer, but we should see them as integral part of our realm."
 new_flavour_bur.11.a:0 "Conquer them!"
 
 new_flavour_bur.12.t:0 "Burgundian purchase of Calais"
 new_flavour_bur.12.d:0 "Burgundy offered us a large ammount of ducats for our port in Calais. Every side the port is bordered by them so its pretty sure they claim."
 new_flavour_bur.12.a:0 "Accept the offer."
 new_flavour_bur.12.b:0 "Decline the offer."
 
 new_flavour_bur.13.t:0 "Offer Accepted"
 new_flavour_bur.13.d:0 "England accepted our offer to purchase the port of Calais."
 new_flavour_bur.13.a:0 "Great."
 
 new_flavour_bur.14.t:0 "Offer Declined"
 new_flavour_bur.14.d:0 "England refused our offer to purchase the port of Calais."
 new_flavour_bur.14.a:0 "Not great."
 
 new_flavour_bur.15.t:0 "City of Aachen"
 new_flavour_bur.15.d:0 "The city of Aachen was the seat of the great Frankish Empire. Charlemagne ruled the four realm from here and keeped his eye on other oppurtinities for expansion."
 new_flavour_bur.15.a:0 "This is History"
 
 new_flavour_bur.16.t:0 "Choose Mission"
 new_flavour_bur.16.d:0 ""
 new_flavour_bur.16.a:0 "Catholic Branch"
 new_flavour_bur.16.b:0 "Protestant Branch"
 new_flavour_bur.16.c:0 "Reformed Branch"
 
 new_flavour_bur.17.t:0 "Burgundy offers vassalisation"
 new_flavour_bur.17.d:0 "Burgundy is a renowned state with its loyalty to our great Lord. They asked the Pope to make a defensive step against the muslim agression and became their vassal."
 new_flavour_bur.17.a:0 "The Pope will serve well."
 new_flavour_bur.17.b:0 "The Papacy cannot be subjugated!"
 
 new_flavour_bur.18.t:0 "Pope Accepted the offer"
 new_flavour_bur.18.d:0 "The Pope accepted our defensive offer, but they asked us for the reconquest of Jerusalem. We should claim the Holy Land as ours!"
 new_flavour_bur.18.a:0 "The Papacy is ours!"
 
 new_flavour_bur.19.t:0 "Pope denied the offer."
 new_flavour_bur.19.d:0 "Pope wish to be independent for an eternity. That a lot of time so its time to strike."
 new_flavour_bur.19.a:0 "Rome will fall"
 
 new_flavour_bur.20.t:0 "The Kingdom of Jerusalem"
 new_flavour_bur.20.d:0 "The Great Holy Kingdom are a short lived nation consumed by the muslim aggressors. The Conquest of Jerusalem are a great oppurtinity to revive this realm."
 new_flavour_bur.20.a:0 "Found the Kingdom"
 new_flavour_bur.20.b:0 "Assume Direct Control"
 
 new_flavour_bur.21.t:0 "The Rollin Boof"
 new_flavour_bur.21.d:0 "The Increasing demand for the newly produced Tobacco is a burden for our traders. We should focus on exporting or trade to our citizens."
 new_flavour_bur.21.a:0 "Embrace the Cigar Culture"
 new_flavour_bur.21.b:0 "Just Export"
 
 new_flavour_bur.22.t:0 "The Fancy Coats"
 new_flavour_bur.22.d:0 "Burgundy have a long history in textile industry, the coats are expensive and warm. Great fit for our army to keep them warm but this means a large investment and drop from the market."
 new_flavour_bur.22.a:0 "Use in the Military"
 new_flavour_bur.22.b:0 "Just Trade it"
 
 new_flavour_bur.23.t:0 "Austrian fiscal problems"
 new_flavour_bur.23.d:0 "Austria facing a nearly empty treasury. They needing every help to keep their status and prestige, so its a great oppurtunity to increase the relations with them."
 new_flavour_bur.23.a:0 "We should aid them."
 new_flavour_bur.23.b:0 "Keep the money."
 
 new_flavour_bur.24.t:0 "Burgundian Help"
 new_flavour_bur.24.d:0 "Burgundy aided us in these hard times."
 new_flavour_bur.24.a:0 "Great"

