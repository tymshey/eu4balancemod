 # Missions

 mam_restore_madinat_as_salam_title:0 "Madinat as-Salam"
 mam_restore_madinat_as_salam_desc:0 "Modern Baghdad, Madinat as-Salam, the 'City of Peace', was once the capital of the Abbasid Caliphate, and a thriving center of culture and learning in the region. By restoring this city to its former glory, we can revive our cultural heritage and attract scholars, artists, and traders from across the Islamic world, strengthening our influence and prestige."
 mam_artisans_of_egypt_title:0 "The Artisans of Egypt"
 mam_artisans_of_egypt_desc:0 "By bringing silkworms from Persia to Egypt, we can establish a thriving silk industry that will boost our economy and enhance our cultural influence. The artisans of Egypt are skilled in various crafts, and by supporting them, we can create exquisite goods that are highly sought after in the region and beyond."
 mam_the_sultans_general_staff_title:0 "The Sultan's General Staff"
 mam_the_sultans_general_staff_desc:0 "The Sultan's General Staff is a prestigious institution that oversees the training and organization of our military forces. By investing in this institution, we can enhance our military capabilities and ensure that our forces are well-prepared to defend our interests and expand our influence in the region."
 mam_trans_saharan_trade_route_title:0 "Trans-Saharan Trade Route"
 mam_trans_saharan_trade_route_desc:0 "By reestablishing a trade route across the Sahara Desert, we can facilitate commerce between our territories and the markets of West Africa, boosting our economy and enhancing our influence in the region."
 mam_a_naval_industry_title:0 "A Naval Industry"
 mam_a_naval_industry_desc:0 "By investing in the development of a naval industry, we can strengthen our maritime capabilities and enhance our influence in the region. A robust naval industry will allow us to build and maintain a powerful fleet, enabling us to protect our trade routes, project power, and expand our reach across the seas."
 mam_horn_of_africa_title:0 "Up the Blue Nile"
 mam_horn_of_africa_desc:0 "The isolated Christian mountain kings and coastal Somali sultans long held the lifelines of our empire. Their historic insubordination has been surgically crushed. Our armies have scaled the Abyssinian heights to secure the sacred fountains of the Nile, imposing peace upon the highlands. The entire eastern horn is now chained to Cairo, its rustic isolation replaced by the rigid administrative order of the Caliph's court."
 mam_ink_and_incense_title:0 "Ink and Incense"
 mam_ink_and_incense_desc:0 "The aromatic ports of the Horn of Africa long languished under unrefined merchant clans, leaving the rare incense of Punt underutilized. By decree of the Diwan, we have brought advanced production methods to the south, investing in state-backed scriptoriums, grand marketplaces, and grand production networks. The harvest of exotic spices is no longer left to chance, but systematically maximized by the literate elite to enrich the empire's treasury."
 mam_conquer_niger_title:0 "Subdue the Golden Basin"
 mam_conquer_niger_desc:0 "The proud Sahelian dynasties foolishly believed the Sahara would shield them from Cairo’s judgment. Our Scribe-Tacticians shattered the Mande hosts with mathematical violence, placing their kings in iron chains. The wealth of the Niger loop is no longer a sovereign treasure, but an audited asset bound to the Caliph’s throne. What the scimitar conquered, the pen now contains."
 mam_restore_the_abbasids_title:0 "Return of the Abbasids"
 mam_restore_the_abbasids_desc:0 "For two centuries, the descendants of the Prophet’s uncle survived as powerless puppets in Cairo, reduced to signing administrative charters for our sultans while the true center of the faith fractured. By surgically eliminating internal dissent and recovering ancient Baghdad, we have proven our supreme fitness to govern the Ummah. The era of the hidden puppet is dead. The black banners of the Abbasids shall be raised in absolute sovereignty over the throne of Cairo, merging the unmatched intellectual erudition of our chancellery with the supreme divine mandate of the righteous caliphs."
 mam_restore_the_abbasids_tt:0 "\nThe Abbasid Caliphate will be restored."
 
