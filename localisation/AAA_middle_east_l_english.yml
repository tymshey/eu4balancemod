 # Missions
 
 tur_the_artisans_of_the_sultanate_title:0 "The Artisans of the Sultanate"
 tur_the_artisans_of_the_sultanate_desc:0 "The [Root.GetAdjective] sultanate has a long history of craftsmanship, with artisans producing exquisite goods that are highly sought after. By supporting and promoting these artisans, we can boost our economy and enhance our cultural influence."
 tur_highway_of_an_empire_title:0 "Highway of an Empire"
 tur_highway_of_an_empire_desc:0 "The land strip that separates the Red and Mediterranean seas has brought forth the idea of an engineering endeavor, suggested by our advisors. By connecting the two seas we would surely improve the flow of our navies across them."
 tur_kannuname_i_sehira_title:0 "Kannuname-i Sehirha"
 tur_kannuname_i_sehira_desc:0 "Our domestic Ahidnames have successfully nurtured home-grown joint-stock companies, but these syndicates still rely on ad-hoc royal favors. To truly match the structural financial power of Western empires, we must enshrine these commercial protections into the permanent fabric of imperial law. By promulgating the Kanunname-i Sehirha, we will establish a sweeping legal code for our urban centers—safeguarding corporate property rights, standardizing private investments, and permanently securing our burghers' global economic dominance."

