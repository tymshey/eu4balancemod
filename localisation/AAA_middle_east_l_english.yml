 # Missions

 mam_restore_madinat_as_salam_title:0 "Madinat as-Salam"
 mam_restore_madinat_as_salam_desc:0 "Modern Baghdad, Madinat as-Salam, the 'City of Peace', was once the capital of the Abbasid Caliphate, and a thriving center of culture and learning in the region. By restoring this city to its former glory, we can revive our cultural heritage and attract scholars, artists, and traders from across the Islamic world, strengthening our influence and prestige."
 mam_artisans_of_egypt_title:0 "The Artisans of Egypt"
 mam_artisans_of_egypt_desc:0 "By bringing silkworms from Persia to Egypt, we can establish a thriving silk industry that will boost our economy and enhance our cultural influence. The artisans of Egypt are skilled in various crafts, and by supporting them, we can create exquisite goods that are highly sought after in the region and beyond."
 mam_the_sultans_general_staff_title:0 "The Sultan's General Staff"
 mam_the_sultans_general_staff_desc:0 "The Sultan's General Staff is a prestigious institution that oversees the training and organization of our military forces. By investing in this institution, we can enhance our military capabilities and ensure that our forces are well-prepared to defend our interests and expand our influence in the region."
 mam_trans_saharan_trade_route_title:0 "Trans-Saharan Trade Route"
 mam_trans_saharan_trade_route_desc:0 "By reestablishing a trade route across the Sahara Desert, we can facilitate commerce between our territories and the markets of West Africa, boosting our economy and enhancing our influence in the region."

