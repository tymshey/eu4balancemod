 flavor_mam.117.t:0 "The Black Banner Flies Once More"
 flavor_mam.117.d:0 "For two centuries, the descendants of the Prophet’s uncle survived as powerless puppets in Cairo, reduced to signing administrative charters for our sultans while the true center of the faith fractured. By surgically eliminating internal dissent and recovering ancient Baghdad, we have proven our supreme fitness to govern the Ummah. The era of the hidden puppet is dead. The black banners of the Abbasids shall be raised in absolute sovereignty over the throne of Cairo, merging the unmatched intellectual erudition of our chancellery with the supreme divine mandate of the righteous caliphs."
 flavor_mam.117.a:0 "§JLa Ilaha Illallah!§!"
