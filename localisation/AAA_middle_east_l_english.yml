 t_tofangchi_regiments:0 "Tofangchi Regiments"
 t_tofangchi_regiments_desc:0 "The Tofangchi are the [Root.GetAdjective] musketeers who are enlisted from all parts of the nation. Under the supervision of the [Root.GetNobilityOrFallbackName], these soldiers are trained in proficiency with the muskets, unlike other troops of the [Root.GovernmentName]."
