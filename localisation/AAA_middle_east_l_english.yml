 tur_the_artisans_of_the_sultanate_title:0 "The Artisans of the Sultanate"
 tur_the_artisans_of_the_sultanate_desc:0 "The [Root.GetAdjective] sultanate has a long history of craftsmanship, with artisans producing exquisite goods that are highly sought after. By supporting and promoting these artisans, we can boost our economy and enhance our cultural influence."

