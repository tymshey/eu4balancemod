 estate_qizilbash_TIM_chagatai_warriors:0 "Chagatai Warriors"
 estate_qizilbash_TIM_chagatai_warriors_desc:0 "Furthering the power of the Turkic warriors in our military would certainly do nothing but reinforce the current status quo, though certainly benefitting us in the terms of our military power."
