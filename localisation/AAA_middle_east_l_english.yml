 # Privileges

 estate_burghers_grant_domestic_ahidname:0 "Grant Domestic Ahidname"
 estate_burghers_grant_domestic_ahidname_desc:0 "By repurposing the traditional framework of foreign trade capitulations, the Sublime Porte issues grand corporate charters directly to domestic merchant syndicates. Granting these internal monopolies protects local capital from external powers, transforming the empire's major ports into powerful, state-backed joint-stock ventures that aggressively project Ottoman commerce abroad."
 estate_burghers_kannuname_i_sehirha:0 "Kannuname-i Sehirha"
 estate_burghers_kannuname_i_sehirha_desc:0 "By decreeing a revolutionary imperial code for the cities, the Sublime Porte establishes a secular legal framework to protect urban commercial property and corporate shares. Bypassing traditional agrarian tax-farming, this law system empowers domestic burghers to freely pool private capital into joint-stock syndicates, shifting the imperial economic engine toward a Western-style mercantile economy."
 estate_burghers_kannuname_i_sehirha_tt:0 "Unlock the '§YKannuname-i Sehirha§!' estate privilege for the §YBurghers§!.\n"

 # Events

 flavor_tur.400.title:0 "Eyalet of Adal"
 flavor_tur.400.desc:0 "The Sublime Porte has presented us with a unique opportunity to expand our influence in the Horn of Africa. By establishing the Eyalet of Adal, we can secure our interests in the region, strengthen our trade networks, and enhance our strategic position. This move will not only bolster our economy but also solidify our presence in a region of growing importance."
 flavor_tur.400.a:0 "We shall establish the Eyalet of Adal."
 flavor_tur.400.b:0 "Administrate the region directly."

 flavor_tur.401.title:0 "The Sublime Porte and the Janissaries"
 flavor_tur.401.desc:0 "Recently, the Sublime Porte has been facing challenges in maintaining the loyalty and discipline of the Janissary corps. The Janissaries, once the elite military force of the Ottoman Empire, have become increasingly unruly and resistant to reforms. As a result, the Sultan has called for a series of measures to restore order and ensure the continued effectiveness of this vital institution."
 flavor_tur.401.a:0 "We shall support the Sublime Porte measures to restore order."
 flavor_tur.401.b:0 "Better not risk the ire of the Janissaries..."

