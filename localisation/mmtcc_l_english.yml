 mmtcc.99.t:0 "Karl's Reminder"
 mmtcc.99.d:0 "\n\n\n\n£Picture_mmtcc_drink£\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThis is Karl. Karl knows you've been playing EU4 for a while, so he has decided to remind you to drink some water every so often. Say: "Cheers, Karl!"\n\nHow many years from now would you like Karl to remind you to drink water?"
 mmtcc.99.a:0 "In 40 years, Karl"
 mmtcc.99.b:0 "In 60 years, Karl"
 mmtcc.99.c:0 "In 80 years, Karl"
 mmtcc.99.e:0 "You don't need to remind me anymore. Thanks, Karl"