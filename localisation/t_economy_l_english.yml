 t_colonial.1.title:0 "Competitive Merchants"
 t_colonial.1.desc:0 "The merchants of our realm have long been a powerful force in our economy, but they have often been overshadowed by the grandeur of our noble houses. With the recent surge in trade and commerce, however, these enterprising individuals have begun to assert their influence more boldly. They are now competing fiercely for control over lucrative trade routes and markets, challenging the traditional dominance of the aristocracy."
 t_colonial.1.a:0 "This will increase our income from trade."

 # Events

 t_prices.1.title:0 "Slave Trade Surged"
 t_prices.1.desc:0 "Reports from our overseas merchants speak of turmoil and opportunity in equal measure. Conflict and expansion in distant lands have driven an unprecedented demand for forced labor, while rival powers struggle to secure sufficient supply. Markets from the coasts of West Africa to the plantations of the New World now bid ever higher for this commodity."
 t_prices.1.a:0 "This will increase the demand for slaves, surely."
 T_SLAVE_TRADE_SURGED:0 "Slave Trade Surged"

 t_prices.2.title:0 "Reinheitsgebot"
 t_prices.2.desc:0 "As brewing grows from a local craft into a major commercial industry, concerns over quality, taxation, and food security have come to a head. In response, a new decree has been proposed to regulate the ingredients of beer, mandating that only barley, hops, and water may be used. While this stabilizes grain prices for bread and ensures a high standard of purity for our exports, traditional brewers who rely on cheap substitutes like rye, wheat, or questionable herbs protest the sudden restriction."
 t_prices.2.a:0 "Yes, Please"
 REIN:0 "Reinheitsgebot"

 t_prices.3.title:0 "The Decline of the Steppe Horse Trade"
 t_prices.3.desc:0 "For centuries, the vast pastoral networks of the steppes held an absolute monopoly on the breeding and supply of warhorses, commanding immense wealth from sedentary empires desperate for cavalry mounts. However, the steady rise of gunpowder, structured infantry drill, and professional standing armies has drastically altered the nature of warfare. With cavalry forces shrinking and battlefield tactics shifting away from mass horse-archery, the once-lucrative steppe markets are emptying. The nomadic clans face a painful economic collapse as their primary strategic commodity loses its global value."
 t_prices.3.a:0 "We must adapt."
 DECLINE_OF_CAVALRY:0 "Decline of Cavalry"

 t_prices.4.title:0 "The Advent of Hard Cheeses"
 t_prices.4.desc:0 "For generations, cheese was a highly perishable local commodity, prone to spoiling before it could reach distant markets. However, the widespread adoption of advanced mechanical cheese presses across the North Sea region has revolutionized dairy production. By applying immense, uniform pressure, curds are drained of moisture to create dense, hard cheeses. These durable wheels can withstand months of travel without spoiling, making them an indispensable, high-demand ration for merchant fleets and imperial navies alike. The global demand for cheese has skyrocketed."
 t_prices.4.a:0 "A triumph of preservation!"
 CHEESE_PRESS:0 "Cheese Press"