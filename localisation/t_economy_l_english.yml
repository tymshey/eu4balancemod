 # Tradegoods

 beer:0 "Beer"
 beerDESC:0 "Once a localized domestic chore, the commercialization of hopped beer transformed brewing into a massive, tax-yielding urban industry. Fed by regional barley surpluses, major trade networks like the Hanseatic League built fortunes exporting preserved regional ales across global maritime routes."
 parrots:0 "Parrots"
 parrotsDESC:0 "Hailing from the dense canopies of the Indies, these exotic birds became highly lucrative commodities in the global luxury market. Handled by colonial merchants and shipped along transoceanic trade routes, they were sold in major European ports as ultimate symbols of wealth."
 equines:0 "Equines"
 equinesDESC:0 "The cultivation of specific horse breeds required vast pastoral networks, dedicated stud farms, and massive cross-border markets. From the Arabian trade networks to the Eurasian steppes, managing these supply lines was essential for sustaining global transport and military logistics."
 camelry:0 "Camelry"
 camelryDESC:0 "Crucial for navigating arid frontiers, the breeding and trading of camels sustained the vital Silk Road and Trans-Saharan caravan networks. Cultivated by nomadic tribes for their unmatched endurance, these pack and mount animals were commercialized at desert fringe ports, linking isolated economies to global trade."
 amber:0 "Amber"
 amberDESC:0 "Gathered primarily along the stormy shores of the Baltic Sea, this fossilized resin has been prized since antiquity. Coveted for its warm, golden glow, amber was carved into intricate jewelry and luxury religious artifacts. It formed the basis of historic overland trade routes connecting northern tribes to southern empires, serving as a highly valuable currency of prestige."
 cheese:0 "Cheese"
 cheeseDESC:0 "What began as a vital method for preserving perishable milk quickly grew into a sophisticated art of cultivation and aging. From the hard, durable wheels of the Alps—perfect for long-distance transport—to the specialized regional varieties of the Low Countries, cheese evolved into a staple culinary commodity that fueled urban markets and sustained sailors on long voyages."
 
