l_english:
 2_hun_renaissanse_knowledge:0 "Danubian Development Program"
 2_hun_renaissanse_knowledge_desc:0 "To secure Hungary's future, we must modernize our core lands. By investing heavily in civil engineering, industrial modernization, and domestic technical expertise, we can turn our plains and cities into the engine of a prosperous, self-reliant nation."
 
 2_bulwark_of_christianity:0 "Bulwark of Christianity"
 2_bulwark_of_christianity_desc:0 "With Turkish power waning in the south it falls to the people of the Kingdom of Hungary to defend Christendom from the Turkish threat. Let it be known that we will not flinch from our duty."
 
 2_found_the_black_army:0 "Found the Black Army"
 2_found_the_black_army_desc:0 "Inspired by the writing of Julius Caesar, Hungary shall have a core of professional troops for her armies. These men will be so tough that our enemies will brand the soldiers the black army."
 
 2_reformed_coinage:0 "Reformed Coinage"
 2_reformed_coinage_desc:0 "To pay four our new professional army we will need a steady stream of revenue. Reforming the coinage to standardize the weights will make this much easier, because we know how much people will have to pay."
 
 2_curtailed_peasantry:0 "Curtail the Freedom of the Peasantry"
 2_curtailed_peasantry_desc:0 "Hungary is not blessed with natural frontiers on which she can base her defense. The wild plain that first brought our ancestors here was perfect for launching raids into the West, not for defense. If Hungary is to be defended we will need resources. If we agree allow to our magnates to tie the peasantry more closely to the land they will ensure they work harder."
 
 2_strengthened_towns:0 "Strenghten the Towns"
 2_strengthened_towns_desc:0 "Hungary needs wealth to grow and prosper and the towns are key to this. If we ensure our towns are properly protected from the nobles they will continue to bring in trade that we can tax."
 
 2_hungarian_estates_general:0 "National Defense Expansion"
 2_hungarian_estates_general_desc:0 "To secure our borders and maintain strategic independence, we must expand our military infrastructure. Streamlined conscription procedures and enlarged supply depots will allow Hungary to field and maintain significantly larger military formations."
 
 Hun_greater_ideas_start:0 "Greater Hungary Traditions"
 
 Hun_greater_ideas_bonus:0 "Greater Hungary Ambition"
 