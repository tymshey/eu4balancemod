# Colonial Subject Event
 colonial_dev_stopper.1.t:0 "Expansion Restrictions Lifted"
 colonial_dev_stopper.1.d:0 "Our overlord, [Root.Overlord.GetName], has long forbidden us from expanding further, but the will of our people in [Root.Overlord.GetName] cannot be contained. Our growing resentment toward our overlord's meddling has reached its peak, and we no longer care for their restrictions. Expansion shall continue regardless of their wishes."
 colonial_dev_stopper.1.a:0 "[Root.Overlord.GetName]'s grip weakens!"
 
 # Colonial Overlord Event
 colonial_dev_stopper.2.t:0 "[From.GetName] Defies Us"
 colonial_dev_stopper.2.d:0 "Our colonial subject, [From.GetName], has blatantly disregarded the restrictions we placed upon them, expanding their territory against our will. Their rising liberty desire has made our authority meaningless in this matter."
 colonial_dev_stopper.2.a:0 "We can no longer control them..."

# Colonial Overlord Decisions
 stop_development_alaska_title: "Restrict Expansion in Colonial Alaska"
 stop_development_alaska_desc: "The expansion of Colonial Alaska has become a concern. Allowing further growth may lead to increased autonomy and ambitions that threaten our control. By imposing strict measures, we can halt their colonization efforts and ensure they remain dependent on us."
 
