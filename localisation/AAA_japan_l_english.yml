 # Missions
 
 jap_ally_china_title:0 "Delegation to the Emperor"
 jap_ally_china_desc:0 "Though we rule independently, respect must still be paid to the Emperor of China. By sending a respectful delegation, we secure legitimacy and access to valuable tributary ties, or we could insult them, underlining our prestigious position."
 jap_land_of_joseon_title:0 "Land of the Joseon"
 jap_land_of_joseon_desc:0 "The Joseon Kingdom lies just across the sea — culturally vibrant, yet politically divided. By extending our influence there, we not only secure our position in East Asia, but assert our divine right to shape its destiny."
 jap_fortify_coast_title:0 "Fortify the Coast"
 jap_fortify_coast_desc:0 "Raids and invasions from the sea have haunted our shores. It is time to strengthen our coastal defenses and ensure that no foreign power may again set foot on our soil uninvited."
 jap_fortify_coast_tt:0 "We will gain Naval Combat Bonus off owned coast: §G+1§! on the seas around Japan."
 jap_found_the_eastern_capital_title:0 "Found the Eastern Capital"
 jap_found_the_eastern_capital_desc:0 "With growing prosperity in the east, a second seat of power is necessary. By establishing a grand capital in the developing city of Edo, we secure our hold on the region and showcase our ambition to the world."
 jap_establish_daijo_daijin_title:0 "Establish Daijo-Daijin"
 jap_establish_daijo_daijin_desc:0 "As the imperial court grows, so too must our administrative capacity. The creation of the Daijō-Daijin will centralize governance and assert imperial control over domestic and foreign affairs."
 jap_establish_daijo_daijin_tt:0 "Every §YAdministrative advisor§! will grant §G-2%§! Development Cost per level."
 jap_settle_california_title:0 "Settle California"
 jap_settle_california_desc:0 "Across the vast ocean lies a sun-drenched land of gold and promise. The western shores of California, unclaimed by great powers, offer fertile ground and untold riches. We must stake our claim before others do."
 jap_colonize_cascadia_title:0 "Colonize Cascadia"
 jap_colonize_cascadia_desc:0 "North of California lies a wild land of towering forests and abundant game. Though harsher, its strategic ports and rich timber offer vast potential. By settling here, we anchor our presence along the northern Pacific coast."
 jap_conquer_aztec_title:0 "Aztec Conquest"
 jap_conquer_aztec_desc:0 "Far to the southeast, a mighty empire of gold and blood rules over rich valleys and temples. If we strike swiftly, we can seize their wealth and rewrite the story of conquest in our favor — under the Rising Sun."
 t_jap_colonize_taiwan_title:0 "Colonize Taiwan"
 t_jap_colonize_taiwan_desc:0 "The island of Taiwan lies unclaimed and ripe for expansion. By planting our banner there, we extend our reach across the sea and gain access to foreign markets."
 jap_conquer_philippines_title:0 "Conquer Philippines"
 jap_conquer_philippines_desc:0 "The islands to the south teem with fragmented tribes and trading ports. By extending our power over the archipelago, we dominate vital sea lanes and new resources."