 # Events (vanilla timeframe)
 
 t_japan_events.1.title:0 "Debug: Form Japan"
 t_japan_events.1.desc:0 "parovozik"
 t_japan_events.1.a:0 "dawaj to miesko"
 t_japan_events.1.b:0 "nie dawaj tego mieska"
 
 t_japan_events.2.title:0 "Our Stance Towards China"
 t_japan_events.2.desc:0 "parovozik"
 t_japan_events.2.a:0 "We will conquer them!"
 t_japan_events.2.b:0 "Perhaps we shall cooperate with China."
 t_japan_events.2.c:0 "They are our enemies!"
 
 t_japan_events.3.title:0 "Textiles of Japan"
 t_japan_events.3.desc:0 "As commerce flows more freely and markets expand, the demand for fine Japanese textiles has grown dramatically. Silk from the countryside and cotton from coastal fields now fuel thriving cottage industries. From Kyoto to Edo, weaving houses and merchant guilds multiply, turning once-quiet districts into the heartbeats of production. Dye artisans experiment with vibrant indigo and safflower hues, while loom masters innovate faster techniques passed down through generations. Merchant families grow wealthy, and textiles become not only exports, but symbols of status and culture at home."
 t_japan_events.3.a:0 "Magnificent!"

 t_japan_events.4.title:0 "Rapid Urbanisation"
 t_japan_events.4.desc:0 "As our economy grows and new industries emerge, people from the countryside are flocking to the cities in search of work, opportunity, and a better life. This migration has led to the rapid expansion of urban centres across our realm. Streets once quiet are now bustling, new districts rise swiftly, and merchants thrive like never before."
 t_japan_events.4.a:0 "Magnificent!"

 t_japan_events.5.title:0 "Japanese-Korean Trade Partnership"
 t_japan_events.5.desc:0 "As both our empire and the Kingdom of Joseon expand their influence across the vast Pacific, a new commercial era emerges. Japanese merchants in California report a surge in trade with Korean settlers further north, exchanging exotic American goods, silks, and metals. Korean traders sail into our ports bearing tobacco, maize, and silver — their goods flowing through Joseon's trade networks and into ours. Seeing an opportunity, our ministers propose a formal agreement to deepen this economic bond."
 t_japan_events.5.a:0 "Officialize the agreement."
 t_japan_events.5.b:0 "We shall put a tax on it."
 t_japan_events.5.c:0 "Let us leave it to the merchants."

 t_japan_events.6.title:0 "The Rise of a Nation"
 t_japan_events.6.desc:0 "With the last of old daimyos bowing before the central authority, a new spirit takes root in the land of the rising sun. No longer are we a patchwork of warring lords, but a singular realm united by shared language, culture, and purpose. From Kyushu to Honshu, the people begin to think of themselves not just as retainers of their clan, but as sons and daughters of Nippon. A national identity is forming — one that will shape the destiny of our empire for centuries to come."
 t_japan_events.6.a:0 "A new era is upon us."
 t_japan_events_6_tt:0 "All provinces of the Japanese culture group across the world will change its culture to §YJapanese§!."

 t_japan_events.7.title:0 "Stone Foundations"
 t_japan_events.7.desc:0 "As our cities grow and prosper, the need for durable infrastructure becomes paramount. Wooden buildings, while traditional, are vulnerable to fire and decay. To ensure the longevity of our urban centers, we are turning to stone as a primary building material. Skilled masons and architects are being commissioned to construct robust foundations, walls, and public edifices that will stand the test of time."
 t_japan_events.7.a:0 "Magnificent!"

 t_japan_events.8.title:0 "Founding of a New Dynasty"
 t_japan_events.8.desc:0 "As we conquer the mandate of heaven and unify the islands under our rule, a new identity for our empire is being considered. The name 'Japan' has long been used by outsiders, but it does not fully capture the spirit and heritage of our people. 'Great Yamato' harkens back to our ancient roots and the legendary Yamato dynasty that first unified these lands. Adopting this name would signal to the world that we are a powerful, sovereign nation with a proud history."
 t_japan_events.8.a:0 "We shall be Great Yamato!"
 t_japan_events.8.b:0 "Let us remain Japan."

 t_japan_events.9.title:0 "The Interpretation of Heaven"
 t_japan_events.9.desc:0 "The new Japanese Emperors of China have made their position clear: the Confucian system, as practiced for centuries on the mainland, will not be adopted in full. Yet with the Mandate of Heaven now resting upon a Japanese throne, the question of moral order cannot be ignored. Confucian scholars demand orthodoxy, while Shinto priests insist that divine legitimacy flows from the kami, not from foreign doctrine.\n\nWithin the court, a new idea takes shape - not rejection, but fusion. Confucian principles of governance, merit, and duty may serve the state, while Shinto belief anchors the empire’s spiritual legitimacy. Such a path promises stability without submission, but risks displeasing those who see the Mandate as inseparable from Confucian orthodoxy."
 t_japan_events.9.a:0 "A magnificent idea."
 t_japan_events.9.b:0 "We cannot upset the balance of power."

