 # Decisions
 
 t_expand_theodosian_walls_decision_title:0 "Expand the Theodosian Walls"
 t_expand_theodosian_walls_decision_desc:0 "Expand the Theodosian Walls even further, to strengthen the city's defenses against modern siege tactics and artillery."
 
 # Modifiers

 BYZ_theodosian_wall_4:0 "Theodosian Walls"
 BYZ_theodosian_wall_4_desc:0 "Theodosian Walls are one of the symbols of Constantinople. Unbroken, this strip of fortifications protects the city from all invasions."

 ### ITALY

 is_kingdom_of_god_flag_tt:0 "Is Kingdom of God"

 # Missions

 PAP_ITA_rightful_heirs_title:0 "Rightful Heirs"
 PAP_ITA_rightful_heirs_desc:1 "The legacy of Rome is a common one. Each powerful European Monarch takes their chance to present themselves as the rightful heirs to Caesar, Octavian, and the like. All the Holy Roman Emperors and rulers of Rûm seem to forget that the greatest empire originates not from Vienna or Constantinople but from Roma."
 PAP_ITA_holy_roman_delusions_title:0 "Holy Roman Delusions"
 PAP_ITA_holy_roman_delusions_desc:0 "The Germanic Holy Roman Empire has tarnished the name of the Romans. For centuries they claimed they had the audacity to claim the mantle of Rome. Let us punish them for their trespasses and end this unholy Germanic delusion."
 PAP_ITA_african_coastline_title:0 "Follow the Coast"
 PAP_ITA_african_coastline_desc:0 "The once serene roman Carthage has been reduced to a few squabbling states engaging in piracy. The tolerance for such vile acts has run out."
 PAP_ITA_britain_title:0 "Conquer Albion"
 PAP_ITA_britain_desc:1 "Like Claudius did hundreds of years before, let us assemble a new fleet at once, putting a new end to the self-rule of the Britons. The famed wooden wall shall be no match to what we can muster in the name of Rome."
 PAP_ITA_to_the_rhine_title:0 "To the Rhenus"
 PAP_ITA_to_the_rhine_desc:0 "The Rhine River once used to constitute a natural border between Rome and the Germanic tribes. Let us restore this boundary and protect this limes until we are ready to subdue the lands beyond."
 PAP_ITA_to_the_rhine_tt:0 "Is a province bordering or near the §YRhine§! river"
 PAP_ITA_galleasses_title:0 "Perfect the Galleass"
 PAP_ITA_galleasses_desc:0 "Galleass is the adoption of the heavy Galleons to the combat standards favoring the Mediterranean galleys. Let us improve upon this invention so that our fleets can ensure the Mediterranean is 'Our Sea'!"
 PAP_ITA_reform_the_military_title:0 "Adapt Our Military"
 PAP_ITA_reform_the_military_desc:0 "The current state of our military is the result of centuries of development. Due to the unification efforts, the recruitment standards and traditions tend to differ from state to state. We need to take some time to reform this system to our current needs."
 PAP_ITA_economic_liberalism_title:0 "Economic Liberalism"
 PAP_ITA_economic_liberalism_desc:1 "Since the dawn of the Age of Discovery, Italian prosperity has been giving way to economies fueled by Colonialism. Due to this, various Italian dynasties began experimenting, trying to find an economic philosophy that would solve their hardships. It's about time we found ours."
 PAP_ITA_glass_title:0 "Italian Crystal"
 PAP_ITA_glass_desc:0 "Italian, especially Venetian crystal has become famous across all of Europe for being the finest glass. Produced mostly on the island of Murano, we need to increase its production and to improve knowledge elsewhere so that we can make our glass products a symbol of status."
 PAP_ITA_unify_regional_economies_title:0 "Unify Regional Economies"
 PAP_ITA_unify_regional_economies_desc:0 "The regional economic differences are jarring. Depending on who ruled which lands, various territories are taxed completely differently, agriculture is conducted differently, and so on. We need to standardize the economic output of the entire country."
 PAP_ITA_wine_title:0 "Italian Wine"
 PAP_ITA_wine_desc:0 "Other countries have famous wine-growing regions, one could say that Italy is a famous wine-growing region in of itself. Her wine contributing to her fame, Italy should continue nurturing this tradition."
 PAP_ITA_industrial_triangle_title:0 "Industrial Triangle"
 PAP_ITA_industrial_triangle_desc:0 "With the development of industry, the northwest has become dominant. The cities of Turin, Milan, and Genoa became the vertices of the newly found industrial triangle."
 PAP_ITA_silk_title:0 "Promote Sericulture"
 PAP_ITA_silk_desc:0 "Along the trade routes, the silkworm has escaped China and entered Europe centuries ago, with the art of Sericulture taking strong roots in Italy. The production of this luxurious textile must be promoted."
 PAP_ITA_train_of_thought_title:0 "Train of Thought"
 PAP_ITA_train_of_thought_desc:0 "The Renaissance has made Italy the centerpiece of Europe with every nation trailing behind experiencing rebirths of their own. Let Italian arts be reborn again so as to bring forth a new age where the human mind will be enlightened."

 PAP_ITA_the_trades_to_come_title:0 "The Trades to Come"
 PAP_ITA_the_trades_to_come_desc:1 "The commercial status of Italy does not seem so insurmountable anymore. By reforming our approach and preparing for the trades to come we will become an even stronger trading power."
 PAP_ITA_at_least_300_trade_income:0 "At least §Y300§! Trade Income"
 PAP_ITA_branch_1_12_title:0 "Branching Mission"
 PAP_ITA_branch_1_12_desc:0 "This is a Branching Mission. Its triggers and effects will be based on our choice in 'The Trades to Come' mission."
 PAP_ITA_branch_1_13_title:0 "Branching Mission"
 PAP_ITA_branch_1_13_desc:0 "This is a Branching Mission. Its triggers and effects will be based on our choice in 'The Trades to Come' mission."
 PAP_ITA_branch_2_12_title:0 "Branching Mission"
 PAP_ITA_branch_2_12_desc:0 "This is a Branching Mission. Its triggers and effects will be based on our choice in 'The Trades to Come' mission."
 PAP_ITA_genoa_node_title:0 "[Root.GetPreviewColorITA_TRADE]Western Favoritism[Root.GetPreviewColorITA_TRADE_end]"
 PAP_ITA_genoa_node_desc:0 "Genoa has been the western commercial hub for centuries. However, with the age of discovery ongoing, it seems to have potential to eclipse its eastern venetian counterpart both in wealth and renown. Let us count on that possibility to be true."
 PAP_ITA_italian_discovery_title:0 "[Root.GetPreviewColorITA_TRADE]The Italian Discovery[Root.GetPreviewColorITA_TRADE_end]"
 PAP_ITA_italian_discovery_desc:0 "The discovery of America was done by an Italian navigator first and foremost. It may have been made for a different power but that is irrelevant. Let us claim the Americas for ourselves."
 PAP_ITA_venice_node_title:0 "[Root.GetPreviewColorITA_TRADE]Venetian Supremacy[Root.GetPreviewColorITA_TRADE_end]"
 PAP_ITA_venice_node_desc:0 "The Serene Republic of Venice is the most renowned and prestigious of Italian Merchant Cities. Though entering a period of stagnation, we can pull it together and make it our principal trade port."
 PAP_ITA_journey_to_the_east_title:0 "[Root.GetPreviewColorITA_TRADE]Journey to the East[Root.GetPreviewColorITA_TRADE_end]"
 PAP_ITA_journey_to_the_east_desc:0 "The Spice markets were closed to Western European merchants when the Ottomans started dominating the East. We have reversed this and further strengthened Venetian monopoly on the Spice trade."
 PAP_ITA_plus_ultra_title:0 "[Root.GetPreviewColorITA_TRADE]Plus Ultra[Root.GetPreviewColorITA_TRADE_end]"
 PAP_ITA_plus_ultra_desc:0 "In our quest for market domination we should begin by acquiring privileges and renown in the western markets and especially across the Pillars of Hercules, our gates to the New World."
 PAP_ITA_explore_eastern_markets_title:0 "[Root.GetPreviewColorITA_TRADE]Eastern Markets[Root.GetPreviewColorITA_TRADE_end]"
 PAP_ITA_explore_eastern_markets_desc:0 "It's time to get the merchants of Eastern Mediterranean accustomed to our new ambitions. As we secure privileges and tax exemptions or simply win with numbers, the east shall embrace Italian as its lingua franca."
 
 PAP_ITA_venice_missions:0 "Venetian Trade Path"
 PAP_ITA_genoa_missions:0 "Genoese Trade Path"
 PAP_ITA_preview_venice:0 "Preview the '§OVenetian Trade Path§!' Mission Tree."
 PAP_ITA_preview_genoa:0 "Preview the '§OGenoese Trade Path§!' Mission Tree."
 PAP_ITA_this_is_a_branching_mission:0 "This is a §YBranching Mission§!. Complete '§YThe Trades to Come§!' Mission to preview each branch."

 PAP_JHC_ITA_prosperity_for_all_title:0 "Prosperity For All"
 PAP_JHC_ITA_prosperity_for_all_desc:0 "Our great unification cannot be purely political. We must do our utmost to provide security and economic strength for all Italians, so that we all may prosper."
 PAP_JHC_ITA_develop_the_south_title:0 "Develop The South"
 PAP_JHC_ITA_develop_the_south_desc:0 "Stability alone is not enough to improve the lot of all our people. Southern Italy in particular has historically suffered great hardships. If we want all Italians to be content with our rule, we must pay special attention to the Mezzogiorno."
 PAP_JHC_ITA_continue_the_renaissance_title:0 "Continue the Renaissance"
 PAP_JHC_ITA_continue_the_renaissance_desc:0 "Italy has long been the cradle of intellectual thought and artistic achievement. We should do our utmost to support these fine traditions, and expand the educational centers of learning which have done so much to spread new ideas and inspire new generations of thinkers and artists."
 PAP_JHC_ITA_italia_transalpina_title:0 "Italia Transalpina"
 PAP_JHC_ITA_italia_transalpina_desc:0 "Provence and Savoy have historical relations with our great country, and we should do everything in our power to strengthen those ties, such as conquering those lands."
 PAP_JHC_ITA_the_seven_provinces_title:0 "The Seven Provinces"
 PAP_JHC_ITA_the_seven_provinces_desc:0 "The Occitans of Southern France have longstanding connections with Italy, with mutual influences on culture, thinking, and peoples. It is only right that we encourage these connections, and bring southern France into the fold."
 PAP_JHC_ITA_the_gallic_wars_title:0 "The Gallic Wars"
 PAP_JHC_ITA_the_gallic_wars_desc:0 "Long ago, our ancestors went forth and brought civilization to Gaul. Quite frankly, it's about time we do it again."
 PAP_JHC_ITA_give_him_back_his_legions_title:0 "Return His Legions"
 PAP_JHC_ITA_give_him_back_his_legions_desc:0 "We have pushed ourselves deep into old Gaul, but our achievements are still overshadowed by the conquests of the great Giulio Cesare. We must strike out and achieve something the ancient Romans never succeeded in doing; we must defeat the Germans at Teutoberg Forest!"
 PAP_JHC_ITA_alpine_defenses_title:0 "Alpine Defenses"
 PAP_JHC_ITA_alpine_defenses_desc:0 "Italy's natural border in the north is the Alps, but the Alps alone cannot stop invading armies. We must ensure that adequate defenses are in place to prevent enemy armies from marching through Alpine passes into our lands."
 PAP_JHC_ITA_take_the_littoral_title:0 "Take The Littoral"
 PAP_JHC_ITA_take_the_littoral_desc:0 "Italy controls many ports on the Adriatic, but many other realms control many other ports on that great sea as well. It would be prudent for us to secure the coastline and prevent interlopers from encroaching upon our waters."
 PAP_JHC_ITA_redeem_tirolo_title:0 "Redeem Tirolo"
 PAP_JHC_ITA_redeem_tirolo_desc:0 "Tirol, as the Germans call it, is a great Alpine territory, one that has served as a crossroads and a bastion for many great empires, including the Romans. Some of our people still live among those mountains, particularly in the south. If we secured those lands, we would be bringing more Italians into the fold and giving ourselves a great defensive line in the north."
 PAP_JHC_ITA_humiliate_austria_title:0 "Humiliate Austria"
 PAP_JHC_ITA_humiliate_austria_desc:0 "The Austrians have long been a thorn in our side, and continue to pretend they are better than us. They even have had the gall to proclaim themselves 'Roman' emperors! It is time we showed them that we are not to be trifled with."
 PAP_JHC_ITA_a_real_roman_empire_title:0 "A Real Roman Empire"
 PAP_JHC_ITA_a_real_roman_empire_desc:0 "Our domains stretch across the map, and our competitors have been humbled. It is time we acknowledge that we are the true and sole inheritors of Rome's greatness."
 PAP_JHC_ITA_spagna_tarraconense_title:0 "Spagna Tarraconense"
 PAP_JHC_ITA_spagna_tarraconense_desc:0 "Our control of the Mediterranean can never be complete as long as we have interlopers like the Spanish around. We must assert our power along the eastern Iberian coast, and stop the Spanish from infringing on our sea."
 PAP_JHC_ITA_hispaniae_title:0 "Hispaniae"
 PAP_JHC_ITA_hispaniae_desc:0 "The weak Spanish continue to insist on an unenlightened existence away from our benevolent rule. We must reach out, and help them flourish under the enlightened guidance of Italy."
 PAP_JHC_ITA_complete_the_risorgimento_title:0 "Complete The Risorgimento"
 PAP_JHC_ITA_complete_the_risorgimento_desc:0 "Although we may have created an Italian state, our work is not yet done! There are still Italians our there who cry out to be reunited with their brothers. We must liberate all of our people from foreign rule!"
 PAP_JHC_ITA_answer_the_roman_question_title:0 "The Roman Question"
 PAP_JHC_ITA_answer_the_roman_question_desc:0 "The Italian nation and the Papacy are in an awkward position. Through tradition and history, the Papacy claims the right to rule large swathes of Central Italy. Through people and geography, Italy claims the right to rule all of the Italian peninsula. Tensions will remain between the two institutions, unless a more permanent agreement can be reached."
 PAP_JHC_ITA_a_place_among_the_great_powers_title:0 "Among The Great Powers"
 PAP_JHC_ITA_a_place_among_the_great_powers_desc:0 "Our prestige and power mean little if it is not acknowledged by our neighbors. We must ensure that we have a place among the Great Powers of the world and that they acknowledge us as their equal in relations and might."
 PAP_JHC_ITA_cross_the_pindus_title:0 "Cross The Pindus"
 PAP_JHC_ITA_cross_the_pindus_desc:0 "Our hold on the Adriatic will not be secure as long as there is a great hinterland full of strife. It is only under our rule that there can be peace, and so we must set forth and bring these war-torn lands under our industrious governance."
 PAP_JHC_ITA_reclaim_our_latin_heritage_title:0 "Reclaim Our Latin Heritage"
 PAP_JHC_ITA_reclaim_our_latin_heritage_desc:0 "Centuries ago, our ancestors attempted to mend the Great Schism and assert control over the heart of the Eastern Roman world. They succeeded, for a time, but gradually their power waned and their domains fell. It is time we tried again."
 PAP_JHC_ITA_anatolian_frontier_title:0 "Anatolian Frontier"
 PAP_JHC_ITA_anatolian_frontier_desc:0 "Our eastern holdings cannot be safe as long as the Turks continue to threaten us in Anatolia. We must create a new frontier in Asia Minor, to subjugate through who would threaten our domains."
 PAP_JHC_ITA_a_worthy_navy_title:0 "A Worthy Navy"
 PAP_JHC_ITA_a_worthy_navy_desc:0 "Italy is a large peninsula, surrounded by vast waters and many other naval powers. Without a respectable fleet of our own, we would be defenseless against naval blockades and invasions. We must construct a fleet to defend our lands and our glories."
 PAP_JHC_ITA_africa_proconsulare_title:0 "Africa Proconsulare"
 PAP_JHC_ITA_africa_proconsulare_desc:0 "Our hold on the Mediterranean is under threat by Barbary pirates and other scoundrels from North Africa. If we want to protect our lands, we must destroy the pirates' hideouts and the North African governments that protect them."
 PAP_JHC_ITA_befriend_ethiopia_title:0 "Befriend Ethiopia"
 PAP_JHC_ITA_befriend_ethiopia_desc:0 "Ancient legends speak of the Kingdom of Prester John, a Christian king who lived on the far side of heathen realms. Gradually, we learned more; Marco Polo himself spoke of the great Christian kingdom of Ethiopia, and our contacts with that African land have only increased since then. It is in the interests of posterity and in our strategic interests to reach out to the Ethiopian people and forge bonds of friendship and mutual protection."
 PAP_JHC_ITA_befriend_ethiopia_capital_tt:0 "Capital is in the region §YHorn of Africa§!"
 PAP_JHC_ITA_invade_egypt_title:0 "Invade Egypt"
 PAP_JHC_ITA_invade_egypt_desc:0 "Our domains may stretch far, but venerable Egypt still remains beyond our grasp. These rich lands would be a gateway to the east and the lucrative trades of Asia and Africa."
 PAP_JHC_ITA_terra_santa_title:0 "Terra Santa"
 PAP_JHC_ITA_terra_santa_desc:0 "As a great state, it is our solemn and righteous duty to protect the Holy Lands. Providence calls us forth to establish a new regime in Jerusalem, and bring the whole of the Levant under our pious administration."